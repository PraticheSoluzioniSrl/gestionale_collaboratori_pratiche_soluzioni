<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratiche Soluzioni — Gestionale</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="12" fill="%23ffffff"/%3E%3Cpath d="M14 10h18c8 0 12 4 12 11 0 6-3 9-9 11l-8 3v18h-7V10Zm7 7v16l10-4c4-1 6-3 6-7 0-3-2-5-6-5H21Z" fill="%231B2A4E"/%3E%3Cpath d="M42 14h8v40h-8z" fill="%2375CEF3"/%3E%3C/svg%3E'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --navy:#1B2A4E; --navy2:#142038; --navy-dark:#0C2A69; --sky:#75CEF3; --teal:#75CEF3;
  --cyan:#25B9E9;
  --bg:#F2F6FB; --ink:#152238; --mut:#5A6B85; --muted:#5A6B85; --line:#E2EAF4; --card:#fff;
  --amber:#B97A00; --amberbg:#FFF4D6; --amber-bg:#FFF6E0;
  --red:#C2403A; --redbg:#FDE8E7; --red-bg:#FDECEA;
  --green:#0B6B3A; --green-bg:#E9F7EF;
  --tealbg:#E8F6FD; --r:12px;
  --sh:0 1px 2px rgba(18,34,74,.05), 0 8px 24px rgba(18,34,74,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Hanken Grotesk',sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::placeholder{color:#93A4BC}

/* LOGIN */
.lwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--navy) 0%,#243660 55%,#4a9fd4 100%);padding:20px}
.lcard{background:#fff;border-radius:20px;padding:36px 34px;width:min(440px,100%);box-shadow:0 24px 70px rgba(4,16,44,.45)}
.lcard .logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;letter-spacing:-.5px;display:flex;align-items:center;gap:9px;margin-bottom:6px}
.lcard .logo b{color:var(--sky)}
.lcard .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--teal)}
.lcard .sub{color:var(--mut);font-size:13.5px;margin-bottom:24px}
.lfld{margin-bottom:14px}
.lfld label{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:6px}
.lfld input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;outline:none}
.lfld input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(66,168,240,.15)}
.lerr{background:var(--redbg);color:var(--red);font-size:13px;font-weight:600;border-radius:10px;padding:10px 13px;margin-bottom:14px}
.lbtn{width:100%;background:var(--navy);color:#fff;font-weight:700;font-size:15px;border-radius:11px;padding:14px}
.lbtn:hover{background:#0D3585}
.ldemo{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--mut);line-height:1.7}
.ldemo b{color:var(--ink)}
.ldemo .mono{background:#F0F5FC;border-radius:5px;padding:1px 6px;font-size:11.5px}
.lpick{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.15s}
.lpick:hover{border-color:var(--sky);background:#F7FAFE}
.lpick .av{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Bricolage Grotesque';font-size:14px;flex-shrink:0}
.lpick .nm{font-weight:700;font-size:14px}
.lpick .rl{font-size:12px;color:var(--mut)}
.lpick .go{color:var(--sky);font-weight:700;margin-left:auto}

/* APP */
.app{display:flex;min-height:100vh}
.side{width:250px;background:var(--navy);color:#E8EEF8;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:none;flex-shrink:0}
.area-main{padding:0!important;flex:1;min-width:0;display:flex;flex-direction:column}
.logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:21px;letter-spacing:-.5px;padding:0 10px 16px;display:flex;align-items:center;gap:8px;color:#fff}
.logo img{display:block;height:32px;width:auto;max-width:100%}
.logo .fallback{display:none;color:#fff;font-size:20px;line-height:1.1}
.logo .fallback b{color:var(--sky)}
.navlabel{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8FA3C4;padding:14px 12px 6px}
.navlabel:first-of-type{padding-top:4px}
.navgroup{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:#A8B8D4;font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase;text-align:left;cursor:pointer}
.navgroup:hover{background:rgba(255,255,255,.08);color:#fff}
.navgroup.on{background:rgba(45,212,191,.18);color:#fff}
.navgroup .navchev{font-size:11px;opacity:.85}
.navsub{padding-left:6px}
.nav-it{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#C5D0E4;font-weight:600;font-size:14px;width:100%;text-align:left}
.nav-it:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-it.on{background:#2DD4BF;color:#fff}
.nav-it .ic{width:20px;text-align:center;font-size:15px}
.nav-it .bdg{margin-left:auto;background:#EF4444;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 7px}
.nav-it .lock{margin-left:auto;font-size:10px;opacity:.7}
.side .who{font-size:12.5px;color:#8FA3C4;line-height:1.5;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0 4px}
.side .who b{color:#fff;display:block;font-size:14px}
.side .out{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;width:100%;background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:13px;padding:10px 12px;border-radius:10px;text-align:center}
.side .out:hover{background:rgba(255,255,255,.16)}
.side-sync{font-size:11px;color:#8FA3C4;padding:0 10px 10px;display:flex;align-items:center;gap:6px}
.tophead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.tophead .logo{padding:0}
.topsync{font-size:11px;color:#7B8EA8;padding:8px 10px;display:flex;align-items:center;gap:6px}
.topnavwrap{display:flex;flex-direction:column;gap:8px}
.topsec{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.topsecbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#6F8099;font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.topsecbtn.on,.topsecbtn:hover{background:#F3F8FD;color:var(--navy);border-color:#CFE0F4}
.topsub,.topline{display:flex;gap:8px;flex-wrap:wrap}
.topitem{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#4B607E;font-weight:600;font-size:13px}
.topitem:hover{background:#F3F8FD;color:var(--navy)}
.topitem.on{background:rgba(66,168,240,.14);color:var(--navy);border-color:#CFE0F4}
.topitem .ic{font-size:14px}

.main{flex:1;min-width:0;padding:26px 28px 100px;overflow-x:hidden}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sub{color:var(--mut);font-size:13.5px;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy2)}
.btn-t{background:var(--teal);color:#fff}.btn-t:hover{filter:brightness(1.06)}
.btn-g{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn-g:hover{border-color:var(--sky)}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{filter:brightness(1.06)}
.btn-sky{background:var(--sky);color:#fff}.btn-sky:hover{filter:brightness(1.06)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lockpill{font-size:11px;font-weight:700;background:var(--navy2);color:#fff;border-radius:99px;padding:4px 11px}

.searchwrap{position:relative;margin-bottom:14px}
.search{width:100%;padding:14px 16px 14px 46px;border:1.5px solid var(--line);border-radius:13px;background:#fff;font-size:15px;outline:none}
.search:focus{border-color:var(--sky)}
.searchwrap .lens{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#93A4BC;font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cnt{font-size:13px;color:var(--mut);margin-bottom:10px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:flex-start}
.card:hover{border-color:var(--sky);box-shadow:0 4px 14px rgba(10,42,108,.07)}
.ava{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--sky),var(--teal));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Bricolage Grotesque';font-size:15px;flex-shrink:0}
.card .bd{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .loc{font-size:12.5px;color:var(--mut);margin-top:2px}
.codes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.code{display:inline-flex;align-items:center;gap:5px;background:#F0F5FC;border:1px solid #DCE7F5;border-radius:7px;padding:3px 8px}
.code .k{font-weight:700;color:var(--mut);font-size:10px;letter-spacing:.4px}
.code .v{font-family:'JetBrains Mono';font-weight:600;color:var(--navy);font-size:11.5px}
.code.open{background:var(--redbg);border-color:#F2C4C2}.code.open .v{color:var(--red)}
.code.warn{background:var(--amberbg);border-color:#F0DCA0}.code.warn .v{color:var(--amber)}
.st{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px}
.st-ok{background:var(--tealbg);color:#0A7E72}
.st-open{background:var(--redbg);color:var(--red)}
.st-warn{background:var(--amberbg);color:var(--amber)}
.note-flag{font-size:12px;color:var(--amber);font-weight:600;margin-top:7px}
.riskmini{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:7px;padding:4px 9px;margin-top:6px}
.r-hi{background:var(--redbg);color:var(--red)}
.r-md{background:var(--amberbg);color:var(--amber)}
.r-ok{background:var(--tealbg);color:#0A7E72}
.boll{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:7px;padding:4px 9px;margin-top:6px}
.boll.paid{background:var(--tealbg);color:#0A7E72}
.boll.due{background:var(--redbg);color:var(--red)}
.boll.paid_collab{background:#EEF4FC;color:var(--navy)}
.card .meta{text-align:right;flex-shrink:0;font-size:12px;color:var(--mut)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;border-left:4px solid transparent;box-shadow:0 1px 2px rgba(15,27,53,.04)}
.kpi .kv{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px}
.kpi .kl{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.kpi.alert{border-left-color:var(--red)}.kpi.alert .kv{color:var(--red)}
.kpi.good{border-left-color:var(--teal)}.kpi.good .kv{color:var(--teal)}
.kpi.navy{border-left-color:var(--navy)}.kpi.navy .kv{color:var(--navy)}
.kpi.warn{border-left-color:var(--amber)}.kpi.warn .kv{color:var(--amber)}

.panel{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 2px rgba(15,27,53,.04)}
.panel .ph{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .ph h3{font-size:15px;font-weight:700}
.panel .ph .sp{margin-left:auto;display:flex;gap:8px}
.panel .pad{padding:20px 22px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);text-align:right;padding:9px 14px;border-bottom:1px solid var(--line);background:#F8FAFD}
.tbl th:first-child{text-align:left}
.tbl td{padding:9px 14px;border-bottom:1px solid #EFF4FA;text-align:right;font-variant-numeric:tabular-nums}
.tbl td:first-child{text-align:left;font-weight:600}
.tbl tr.cat td{background:#F0F5FC;font-weight:800;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--navy);text-align:left}
.tbl tr.tot td{font-weight:800;background:#F8FAFD;border-top:2px solid var(--line)}
.tbl .e{color:var(--mut)}
.tbl .neg{color:var(--red);font-weight:700}
.tbl tr.clk:hover{background:#F7FAFE;cursor:pointer}
.selrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:flex-end;padding:12px 14px;background:#F4F8FD;border:1px solid var(--line);border-radius:12px}
.selrow select,.selrow input[type="text"],.selrow input:not([type]){height:34px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:#fff;min-width:140px;font-weight:600}
.selrow .f{display:flex;flex-direction:column;gap:4px;min-width:130px}
.selrow .f label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}

/* Allineamento sezioni al layout Collaboratori */
.page-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:16px;align-items:start}
.page-split.solo{grid-template-columns:1fr}
@media(max-width:980px){.page-split{grid-template-columns:1fr}}
.detail-drawer{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 1px 2px rgba(15,27,53,.04);position:sticky;top:12px}
.detail-drawer h3{margin:0 0 4px;font-size:17px;font-weight:700}
.detail-drawer .muted{margin-bottom:14px}
.card.on{border-color:var(--sky);box-shadow:0 4px 14px rgba(10,42,108,.08);background:#F7FBFF}
.card .meta .act{margin-top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pay-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pay-tabs .chip{cursor:pointer}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:auto;max-height:62vh;box-shadow:0 1px 2px rgba(15,27,53,.04);margin-bottom:16px}
.tbl-wrap .tbl{margin:0}
.tbl thead th.sticky{position:sticky;top:0;z-index:1;background:#F8FAFD;color:var(--mut)}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}


.saldo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sbox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:0 1px 2px rgba(15,27,53,.04)}
.sbox .l{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.sbox .v{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;margin-top:3px;color:var(--navy)}
.sbox.final{background:var(--navy);border-color:var(--navy)}
.sbox.final .l{color:#A8BCE5}
.sbox.final .v{color:#fff}
.sbox .v.neg,.sbox.neg .v{color:var(--red)}
.sbox.pos .v{color:var(--teal)}
.sbox.warn .v{color:var(--amber)}

.pay-layout{display:grid;grid-template-columns:1fr;gap:16px}
.details-panel{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 2px rgba(15,27,53,.04)}
.details-panel>summary{list-style:none;cursor:pointer;padding:15px 18px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid transparent}
.details-panel>summary::-webkit-details-marker{display:none}
.details-panel[open]>summary{border-bottom-color:var(--line);background:#F8FAFD}
.details-panel .pad{padding:0 18px 18px}
.details-panel .pad .tbl{margin-top:0}
.onlyprint{display:none}
.tbl .pos{color:var(--teal);font-weight:700}

/* import / banca */
.dz{border:2px dashed #B9CFEA;border-radius:15px;background:#fff;padding:34px 20px;text-align:center;color:var(--mut);margin-bottom:16px;cursor:pointer;transition:.15s}
.dz.over{border-color:var(--sky);background:#EAF3FD;transform:scale(1.005)}
.dz .big{font-size:32px;margin-bottom:8px}
.batch{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.batch .fi{width:36px;height:36px;border-radius:9px;background:#EAF3FD;display:flex;align-items:center;justify-content:center;font-size:16px}
.batch .bn{font-weight:700;font-size:13.5px}
.batch .bm{font-size:12px;color:var(--mut)}
.bst{font-size:10.5px;font-weight:700;border-radius:99px;padding:3px 10px;margin-left:auto}
.bst.ok{background:var(--tealbg);color:#0A7E72}
.bst.prev{background:var(--amberbg);color:var(--amber)}
.bst.ann{background:#EDF1F7;color:var(--mut)}
.unk{background:var(--amberbg);border:1px solid #F0DCA0;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.unk .ut{font-weight:700;font-size:13.5px;color:#6B4A00;margin-bottom:9px}
.unkrow{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.unkrow .mono{background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.unkrow select{border:1.5px solid #E5D193;border-radius:8px;padding:6px 9px;background:#fff;font-size:12.5px}
.bkrow{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:7px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:13px}
.bkrow.matched{border-left:4px solid var(--teal)}
.bkrow.um{border-left:4px solid #E0B100;background:#FFFDF4}
.bkrow .d{font-weight:700;font-family:'JetBrains Mono';font-size:12px}
.bkrow .descr{flex:1;min-width:170px;color:var(--mut)}
.bkrow .imp{font-weight:800;font-family:'Bricolage Grotesque'}
.bkrow select{border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;font-size:12.5px}
.bkmatch{font-size:11.5px;font-weight:700;color:#0A7E72;background:var(--tealbg);border-radius:99px;padding:3px 10px}

/* dettaglio collaboratore — pagina intera */
.dpage-h{background:var(--navy);color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:18px;position:relative}
.dpage-h h2{font-size:22px;font-weight:700;padding-right:200px}
.dpage-h .as{font-size:13px;color:#A8BCE5;margin-top:5px}

function rowCalc(r){
  const [cat,voce,qty,tar,tipo,val,base]=r;
  const imp = base!=null ? base : (tar?qty*tar:0);
  const comp = tipo==="fisso" ? qty*val : imp*val;
  return {cat,voce,qty,tar,tipo,val,imp,comp};
}
function saldoData(cid,anno,pagamenti,sanzioni,detMap){
  const src=detMap||CDET;
  const det=src[cid];
  if(!det) return null;
  const rows=det.rows.map(rowCalc);
  const maturato=rows.reduce((a,r)=>a+r.comp,0);
  const sz=sanzioni.filter(s=>s.cid===cid&&s.anno===anno&&!s.pagata).reduce((a,s)=>a+s.importo,0);
  const acc=pagamenti.filter(p=>p.cid===cid&&p.anno===anno).reduce((a,p)=>a+p.importo,0);
  return {rows,maturato,sz,acc,riporto:det.riporto,saldo:det.riporto+maturato-sz-acc};
}
function canRegisterAdvance({cid,anno,importo,causale,pagamenti,sanzioni,detMap}){
  const isAdvance=/acconto/i.test(String(causale||""));
  if(!isAdvance) return {ok:true};
  const d=saldoData(cid,anno,pagamenti,sanzioni,detMap);
  if(!d) return {ok:false,msg:"Nessuna produzione caricata: impossibile registrare acconti in sicurezza"};
  const saldoDisponibile=Math.max(0,d.saldo);
  if(saldoDisponibile<=0) return {ok:false,msg:"Saldo disponibile nullo o negativo: acconto bloccato"};
  if(importo>saldoDisponibile+0.009){
    return {ok:false,msg:`Acconto ${eur(importo)} superiore al saldo disponibile ${eur(saldoDisponibile)}: operazione bloccata`};
  }
  return {ok:true};
}

async function sha256(blob){
  try{
    const buf = await blob.arrayBuffer();
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return Math.random().toString(16).slice(2)+Date.now().toString(16); }
}

const HDR_CODE=["OPERATORE","CODICE","SEDE","STRUTTURA","ZONA","COD."];
const FONTE_VALUE_RULES = {
  CAF: {
    metric: [/SENZA MOD/i,/MODIFICATE/i,/INTEGRATE/i,/DSU.*INVIATE/i,/ASS\./i,/AUT\./i,/BREVI/i],

const pickColsByRules=(headers,regexes)=>(headers||[]).map(h=>String(h||"")).map((h,i)=>({h,i})).filter(x=>regexes.some(rx=>rx.test(x.h))).map(x=>x.i);
const sumCols=(row,cols)=>cols.reduce((a,i)=>a+nVal(row[i]),0);
function pickSheetForProduzione(fonte,anno,sheetNames){
  const names=sheetNames.map(s=>String(s||"").trim());
  const upper=names.map(normS);
  const exact=(v)=>upper.findIndex(s=>s===normS(v));
  const contains=(v)=>upper.findIndex(s=>s.includes(normS(v)));
  const cafSheets=names.filter(s=>normS(s).startsWith("CAF "));
  const yearSheets=names.filter(s=>/^\d{4}$/.test(String(s).trim()));
  const pickNearest=(arr,yr)=>{
    if(!arr.length) return null;
    const cand=arr.map(s=>({s,y:parseInt(String(s).match(/\d{4}/)?.[0]||"0",10)})).filter(x=>x.y);
    if(!cand.length) return arr[0];
    cand.sort((a,b)=>Math.abs(a.y-yr)-Math.abs(b.y-yr));
    return cand[0].s;
  };
  const iSistema=exact("IMPORT_"+fonte);
  if(iSistema>=0) return names[iSistema];
  if(fonte==="CAF"){
    const iExact=exact("CAF "+anno);
    if(iExact>=0)return names[iExact];
    const iContains=contains("CAF "+anno);
    if(iContains>=0)return names[iContains];
    const near=pickNearest(cafSheets,Number(anno)||new Date().getFullYear());
    if(near) return near;
  }else{
    const iYear=exact(String(anno));
    if(iYear>=0)return names[iYear];
    const iContains=contains(String(anno));
    if(iContains>=0)return names[iContains];
    const near=pickNearest(yearSheets,Number(anno)||new Date().getFullYear());
    if(near) return near;
  }
  return names[0];
}
function buildCodeRegistry(collab,keys){
  const reg=new Map();
  collab.forEach(c=>{
    keys.forEach(k=>{
      const v=normS(c.codici[k]).replace("*","");
      if(!v) return;
      if(!reg.has(v)) reg.set(v,[]);
      reg.get(v).push({id:c.id,nome:c.nome,key:k});
    });
  });
  return reg;
}
async function parseProduzione(file,fonte,anno,collab){
  const wb0=await readRows(file);
  const fromSheet=pickSheetForProduzione(fonte,anno,wb0.sheets);
  const {rows,sheetName,sheets}=await readRows(file,fromSheet);
  let hRow=-1, codeCol=0;
  for(let i=0;i<Math.min(rows.length,15)&&hRow<0;i++){
    const r=rows[i].map(normS);
    for(let j=0;j<r.length;j++){
      if(HDR_CODE.some(h=>r[j]===h||r[j].startsWith(h))){hRow=i;codeCol=j;break;}
    }
  }
  const start=hRow>=0?hRow+1:0;
  const counts={};
  const payloadByCode={};
  let righe=0;
  const hdr = hRow>=0 ? rows[hRow].map(x=>String(x||"")) : [];
  const rules = FONTE_VALUE_RULES[fonte] || null;
  const metricCols = rules ? pickColsByRules(hdr,rules.metric||[]) : [];
  const countCols = rules ? pickColsByRules(hdr,rules.count||[]) : [];
  for(let i=start;i<rows.length;i++){
    const code=normS(rows[i][codeCol]);
    if(!code||/TOTALE|TOTAL/.test(code))continue;
    if(hRow<0&&i===0)continue; // salta eventuale intestazione non riconosciuta
    const row=rows[i];
    let metric=1, cnt=1;
    if(metricCols.length){ metric=sumCols(row,metricCols); if(metric<=0) metric=0; }
    if(countCols.length){ cnt=sumCols(row,countCols); if(cnt<=0) cnt=0; }
    righe++; counts[code]=(counts[code]||0)+1;
    if(!payloadByCode[code]) payloadByCode[code]={metric:0,count:0,rows:0};
    payloadByCode[code].rows+=1;
    payloadByCode[code].metric+=metricCols.length?metric:1;
    payloadByCode[code].count+=countCols.length?cnt:1;
  }
  const keys=FONTE_CODEKEYS[fonte]&&FONTE_CODEKEYS[fonte].length?FONTE_CODEKEYS[fonte]:["caf","gest","del","naspi","misia"];
  const reg=buildCodeRegistry(collab,keys);
  const unknown=[];
  const ambigui=[];
  let assoc=0;
  const matchedByCid={};
  Object.entries(counts).forEach(([code,n])=>{
    const hits=reg.get(code)||[];
    if(hits.length===0){unknown.push({codice:code,righe:n});return;}
    if(hits.length>1){ambigui.push({codice:code,righe:n,candidati:hits.map(h=>h.nome)});return;}
    const cid=hits[0].id;
    if(!matchedByCid[cid]) matchedByCid[cid]={metric:0,count:0,rows:0};
    const p=payloadByCode[code]||{metric:n,count:n,rows:n};
    matchedByCid[cid].metric+=p.metric;
    matchedByCid[cid].count+=p.count;
    matchedByCid[cid].rows+=p.rows;
    assoc+=n;
  });
  const strictOk=unknown.length===0&&ambigui.length===0&&hRow>=0&&righe>0;
  return {righe,assoc,unknown,ambigui,matchedByCid,strictOk,headerTrovato:hRow>=0,sheetName,sheets};
}
const onlyDigits=s=>String(s==null?"":s).replace(/[^\d]/g,"");
const maybeCode=s=>{
  const t=normS(s).replace(/\*/g,"");
  if(!t) return "";
  if(/^[A-Z]{1,5}\d{1,6}[A-Z0-9\-]*$/.test(t)) return t;
  if(/^\d{2,6}$/.test(t)) return t;
  return "";
};
async function parseElencoCollaboratori(file,currentCollab){
  const wb0=await readRows(file);
  const sheet=(wb0.sheets||[]).find(s=>normS(s).includes("ANAGRAFICA"))||wb0.sheetName;
  const {rows}=await readRows(file,sheet);
  const h=rows.findIndex(r=>normS(r[0]).includes("COLLABORATORE"));
  if(h<0) throw new Error("Intestazione COLLABORATORE non trovata");
  const maxId=currentCollab.reduce((m,c)=>Math.max(m,c.id||0),0);
  let nextId=maxId+1;
  const existingByName=new Set(currentCollab.map(c=>normS(c.nome)));
  const existingCodes=new Set();
  currentCollab.forEach(c=>Object.values(c.codici||{}).forEach(v=>{const cv=maybeCode(v); if(cv) existingCodes.add(cv);}));
  const out=[];
  const scarti=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];
    const nome=String(r[0]||"").trim();
    if(!nome){ scarti.push({riga:i+1,motivo:"riga vuota"}); continue; }
    const nomeUp=normS(nome);
    if(nomeUp.includes("STRUTTURA SPANO")){ scarti.push({riga:i+1,nome,motivo:"riga struttura ufficio"}); continue; }
    const codici={
      del:maybeCode(r[1]), naspi:maybeCode(r[2]), caf:maybeCode(r[3]), misia:maybeCode(r[4]), gest:maybeCode(r[5])
    };
    const hasAnyCode=Object.values(codici).some(Boolean);
    if(existingByName.has(nomeUp)){ scarti.push({riga:i+1,nome,motivo:"duplice nome"}); continue; }
    const codiciConflitto=hasAnyCode?Object.values(codici).filter(v=>v&&existingCodes.has(v)):[];
    if(codiciConflitto.length){ scarti.push({riga:i+1,nome,motivo:`codice già presente (${codiciConflitto.join(", ")})`}); continue; }
    out.push({
      id:nextId++, nome, cf:onlyDigits(nome).slice(0,16)||("TMP"+Date.now()+Math.random()).slice(0,16),
      assoc:String(r[6]||"").trim(), stato:"ok", f730:true, listino:"Standard",
      codici, tel:[], email:[], citta:"", boll:{2024:"due",2025:"due",2026:"due"}, note:String(r[7]||"").trim(),
      cfg:[["730","perc",nVal(r[13])||0.6],["CAF","perc",nVal(r[13])||0.65],["Patronato","perc",nVal(r[9])||0.6],["NASPI","perc",nVal(r[9])||0.6]],
      prod:[0,0,0,0,0,0], pag:{ult:"",ins:0,reg:false},
      portal:{dashboard:true,compensi:false,documenti:true,comunicazioni:true,stampa:false,mie_pratiche:true,nuova_pratica:true,impdocs:true},
      gestione:{g_prod:false,g_cont:false},
      docs:[], utente:null
    });
    existingByName.add(nomeUp);
    Object.values(codici).forEach(v=>{if(v) existingCodes.add(v);});
  }
  return {nuovi:out,scarti,totaleRighe:Math.max(0,rows.length-(h+1))};
}

  const totColl=righe.reduce((a,r)=>a+r.coll,0);
  const totMarg=righe.reduce((a,r)=>a+r.margine,0);
  const quadratura=Math.abs((totRoma-totColl)-totMarg);
  const macroMap={};
  righe.forEach(r=>{
    if(!macroMap[r.macro]) macroMap[r.macro]={macro:r.macro,roma:0,coll:0,margine:0};
    macroMap[r.macro].roma+=r.roma;
    macroMap[r.macro].coll+=r.coll;
    macroMap[r.macro].margine+=r.margine;
  });
  const macroTotals=Object.values(macroMap).sort((a,b)=>b.margine-a.margine);
  let margSheet=0;
  marg.forEach(r=>{const lab=normS(r[0]); if(!lab||lab.includes("TOTALE")) return; margSheet+=nVal(r[6]);});
  return {
    collaborator:collabSel||"n/d",
    anno:nVal((tar[0]||[])[1])||new Date().getFullYear(),
    righe,macroTotals,totRoma,totColl,totMarg,quadratura,margSheet,
    percentuali:aRow?{inps:nVal(aRow[9]),inpdap:nVal(aRow[10]),enpals:nVal(aRow[11])}:null
  };
}
function parseRomaWorkbook(wb,anno){
  const names=wb.SheetNames||[];
  const target=names.filter(n=>normS(n).includes(String(anno))||normS(n).includes("CAF "+anno));
  const sheets=(target.length?target:names).slice(0,8);
  let totale=0;
  const dettaglio=[];
  sheets.forEach(sn=>{
    const rows=wbRows(wb,sn);
    let h=-1, impCol=-1;
    for(let i=0;i<Math.min(rows.length,20)&&h<0;i++){
      const rr=rows[i].map(normS);
      const j=rr.findIndex(c=>c==="IMPORTO"||c.startsWith("IMPORTO"));
      if(j>=0){h=i;impCol=j;}
    }
    if(h<0) return;
    let sum=0;
    for(let i=h+1;i<rows.length;i++){
      const lab=normS(rows[i][0]);
      if(lab.includes("TOTALE")) continue;
      const v=nVal(rows[i][impCol]);
      if(v>0) sum+=v;
    }
    if(sum>0){totale+=sum; dettaglio.push({sheet:sn,totale:sum});}
  });
  return {totale,dettaglio};
}
function pickRomaYearSheet(sheetNames,anno){
  const names=(sheetNames||[]).map(s=>String(s||"").trim());
  const exact=names.find(n=>normS(n)===normS(String(anno)));
  if(exact) return exact;
  const years=names.filter(n=>/^\d{4}$/.test(n));
  if(!years.length) return names[0];
  years.sort((a,b)=>Math.abs(+a-anno)-Math.abs(+b-anno));
  return years[0];
}
function bestTariffCandidate(row,expected){
  const nums=[];
  for(let i=1;i<=7;i++){
    const v=nVal(row[i]);
    if(v>0) nums.push({idx:i,v});
  }
  const qty=nVal(row[1]);
  const candidates=[];
  nums.forEach(n=>{
    candidates.push(n.v);
    if(qty>0) candidates.push(n.v/qty);
  });
  const valids=candidates.filter(v=>v>0&&v<10000);
  if(!valids.length) return null;
  valids.sort((a,b)=>Math.abs(a-expected)-Math.abs(b-expected));
  return valids[0];
}
function computeRomaTariffFromRow(row){
  const qty=nVal(row[1]);
  const rawF=String(row[5]??"").trim();
  const fVal=nVal(row[5]);
  const hasPercent=/\%/.test(rawF) || (fVal>0&&fVal<=1);
  const nums=[1,2,3,4,5,6,7].map(i=>nVal(row[i]));
  let amount=nVal(row[4]);
  if(hasPercent){
    if(!(qty>0&&amount>0&&amount>=qty)){
      const cand=nums.filter(v=>v>qty).sort((a,b)=>b-a);
      amount=cand[0]||0;
    }
    if(qty>0&&amount>0) return {value:amount/qty,method:"E/C"};
  }else{
    const euroCols=[nVal(row[3]),nVal(row[4]),nVal(row[5])].filter(v=>v>0&&v<=5000);
    if(euroCols.length) return {value:euroCols[0],method:"€ fisso"};
    const cand=nums.filter(v=>v>0&&v<=5000);
    if(cand.length) return {value:cand[0],method:"€ fisso"};
  }
  if(qty>0&&amount>0) return {value:amount/qty,method:"E/C"};
  return {value:null,method:"n.d."};
}
async function parseRomaTariffAudit(file,anno,listini,listinoName){
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
  const sheet=pickRomaYearSheet(wb.SheetNames,anno);
  const rows=wbRows(wb,sheet);
  const cafSheet=(wb.SheetNames||[]).map(s=>String(s||"").trim()).find(s=>normS(s)===normS("CAF "+anno)) || (wb.SheetNames||[]).find(s=>normS(String(s||"")).startsWith("CAF "));
  const cafRows=cafSheet?wbRows(wb,cafSheet):[];
  const lis=(listini[listinoName]&&listini[listinoName][anno])||[];
  const checks=[
    // Patronato (gia mappato)
    {k:"Punto reale patronato", idx:0, rx:/PUNTO REALE PATRONATO/},
    {k:"Punto telematico", idx:1, rx:/PUNTO TELEMATICO/},
    {k:"Punto RDC", idx:2, rx:/PUNTO RDC/},
    {k:"Punto REM", idx:3, rx:/PUNTO REM/},
    {k:"Punto org. patronato", idx:4, rx:/PUNTO ORG/},
    {k:"Punti estero", idx:5, rx:/PUNTI ESTERO/},
    // CAF 730 dettagliato
    {k:"MOD 730 senza modifiche", idx:6, rx:/MOD.*730.*SENZA.*MOD/},
    {k:"MOD 730 esonero pres.", idx:7, rx:/MOD.*730.*ESONERO/},
    {k:"MOD 730 con modifiche", idx:8, rx:/MOD.*730.*CON.*MOD/},
    {k:"MOD 730 con integrazione", idx:9, rx:/MOD.*730.*INTEGRAZ/},
    // CAF ISEE dettagliato
    {k:"ISEE I fascia", idx:10, rx:/ISEE[^A-Z0-9]*I[^A-Z0-9]*FASCIA|MOD ISEE I FASCIA/},
    {k:"ISEE II fascia", idx:11, rx:/ISEE[^A-Z0-9]*II[^A-Z0-9]*FASCIA|MOD ISEE II FASCIA/},
    {k:"ISEE III fascia", idx:12, rx:/ISEE[^A-Z0-9]*III[^A-Z0-9]*FASCIA|MOD ISEE III FASCIA/},
    // CAF RED dettagliato
    {k:"RED asseverati", idx:13, rx:/RED.*ASSEVERAT|MOD RED ASSEVERAT/},
    {k:"RED autocertificati", idx:14, rx:/RED.*AUTOCERT|MOD RED AUTOCERT/},
    {k:"RED brevi", idx:15, rx:/RED.*BREV|MOD RED BREVI/},
  ];
  const out=checks.map(c=>{
    const rMain=rows.find(x=>c.rx.test(normS(x[0])));
    const rCaf=(c.idx>=6&&cafRows.length)?cafRows.find(x=>c.rx.test(normS(x[0]))):null;
    const r=rMain||rCaf;
    const source=rMain?sheet:(rCaf?cafSheet:null);
    const expected=Number(lis[c.idx]||0);
    if(!r) return {voce:c.k,expected,found:null,diff:null,status:"missing",source:null};
    const calc=computeRomaTariffFromRow(r);
    const found=calc.value;
    const diff=(found==null)?null:(found-expected);
    const status=(found==null)?"unreadable":(Math.abs(diff)<=0.01?"ok":"diff");
    return {voce:c.k,expected,found,diff,status,source,method:calc.method};
  });
  const diffs=out.filter(x=>x.status==="diff").length;
  const missing=out.filter(x=>x.status!=="ok").length;
  return {sheet,rows:out,diffs,missing,ok:missing===0};
}
async function buildReconData(sistemaFile,romaFile,anno,sogliaAlert){
  const wbS=XLSX.read(await sistemaFile.arrayBuffer(),{type:"array"});
  const sistema=parseSistemaWorkbook(wbS);
  let roma=null;
  if(romaFile){
    const wbR=XLSX.read(await romaFile.arrayBuffer(),{type:"array"});
    roma=parseRomaWorkbook(wbR,anno||sistema.anno);
  }
  const deltaRomaVsCalcoli=roma?roma.totale-sistema.totRoma:null;
  const soglia=Math.max(0,Number(sogliaAlert||1));
  const alerts=[];
  if(sistema.quadratura>soglia) alerts.push(`Quadratura interna oltre soglia: ${eur(sistema.quadratura)}`);
  const deltaMarg=Math.abs(sistema.totMarg-sistema.margSheet);
  if(deltaMarg>soglia) alerts.push(`Delta margine CALCOLI vs MARGINI oltre soglia: ${eur(deltaMarg)}`);
  if(deltaRomaVsCalcoli!=null && Math.abs(deltaRomaVsCalcoli)>soglia) alerts.push(`Delta file Roma vs CALCOLI oltre soglia: ${eur(deltaRomaVsCalcoli)}`);
  return {sistema,roma,deltaRomaVsCalcoli,deltaMarg,soglia,alerts};
}

function getCfgPercent(c,keys,fallback){
  const cfg=(c&&c.cfg)||[];
  for(const [voce,,val] of cfg){
    const up=normS(voce);
    if(keys.some(k=>up.includes(k))) return Number(val)||fallback;
  }
  return fallback;
}
function importRowFromFonte(fonte,payload,c,listinoTar){
  const f=normS(fonte);
  const qty=Number((payload&&payload.count) || (payload&&payload.rows) || (payload&&payload.metric) || 0);
  const metric=Number((payload&&payload.metric) || 0);
  if(f==="PATRONATO"){
    const tar=Number(listinoTar&&listinoTar[0])||36;
    return ["Patronato","Punti importati",metric,tar,"perc",getCfgPercent(c,["PATRONATO"],0.6)];
  }
  if(f==="CAF"){
    const tar=Number(listinoTar&&listinoTar[10])||10.81;
    return ["CAF — ISEE / RED","Pratiche CAF importate",metric,tar,"perc",getCfgPercent(c,["CAF","730"],0.65)];
  }
  if(f==="NASPI"||f==="DS_AGRICOLE"){
    return ["NASPI","Trattamenti importati",qty,null,"perc",getCfgPercent(c,["NASPI","INPS"],0.6),metric];
  }
  if(f==="MENSILITA"||f==="STIPENDI"){
    return ["Mensilità","Netto importato",qty,null,"perc",getCfgPercent(c,["INPS","MENSILITA"],0.6),metric];
  }
  return ["Import","Produzione importata",qty,null,"perc",0.6,metric||qty];
}
function rebuildCompensiFromBatches({batches,collab,listini,base}){
  const out={};
  collab.forEach(c=>{ if(base[c.id]) out[c.id]=JSON.parse(JSON.stringify(base[c.id])); });
  collab.forEach(c=>{ if(!out[c.id]) out[c.id]={riporto:0,rows:[]}; });
  Object.values(out).forEach(v=>{v.rows=[];});
  const active=(batches||[]).filter(b=>b.stato==="confermato"&&b.matchedByCid&&Object.keys(b.matchedByCid).length);
  active.forEach(b=>{
    const byCid=b.matchedByCid||{};
    Object.keys(byCid).forEach(cidStr=>{
      const cid=+cidStr;
      const p=typeof byCid[cidStr]==="number" ? {metric:Number(byCid[cidStr])||0,count:Number(byCid[cidStr])||0,rows:Number(byCid[cidStr])||0} : byCid[cidStr];
      if(!p || Number(p.metric||0)<=0) return;
      const c=collab.find(x=>x.id===cid);
      if(!c) return;
      const lis=(listini[c.listino]&&listini[c.listino][b.anno])||null;
      out[cid].rows.push(importRowFromFonte(b.fonte,p,c,lis));
    });
  });
  return out;
}

/* --- Estratto conto: CSV/XLSX con rilevamento colonne, PDF con estrazione testo --- */
const parseItNum=s=>{
  if(typeof s==="number")return s;
  const t=String(s).replace(/\./g,"").replace(",",".").replace(/[^\d.\-]/g,"");
  const v=parseFloat(t);return isNaN(v)?null:v;
};
const serialToISO=n=>new Date(Math.round((n-25569)*86400*1000)).toISOString().slice(0,10);
const itToISO=s=>{
  const m=String(s).match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
  if(!m)return null;
  const y=m[3].length===2?"20"+m[3]:m[3];
  return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
};
async function parseBancaTabella(file){
  const {rows}=await readRows(file);
  let h=-1,dCol=-1,xCol=-1,iCol=-1,soloUscite=false;
  for(let i=0;i<Math.min(rows.length,12)&&h<0;i++){
    const r=rows[i].map(normS);
    const di=r.findIndex(c=>c.startsWith("DATA"));
    const xi=r.findIndex(c=>/DESCRI|CAUSALE|OPERAZ|DETTAGL/.test(c));
    if(di>=0&&xi>=0){
      h=i;dCol=di;xCol=xi;
      iCol=r.findIndex(c=>/USCITE|ADDEBIT|DARE/.test(c));
      if(iCol>=0)soloUscite=true;else iCol=r.findIndex(c=>/IMPORTO/.test(c));
    }
  }
  if(h<0)return [];
  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];
    const dRaw=r[dCol];
    const data=typeof dRaw==="number"?serialToISO(dRaw):itToISO(dRaw);
    const imp=parseItNum(r[iCol]);
    if(!data||imp==null||imp===0)continue;
    if(!soloUscite&&imp>0)continue;       // colonna IMPORTO unica: le uscite sono i negativi
    out.push({data,descr:String(r[xCol]||"").trim(),importo:Math.abs(imp)});
  }
  return out;
}
async function parseBancaPdf(file){
  if(!window.pdfjsLib)throw new Error("Libreria PDF non caricata");
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const byY={};
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      (byY[y]=byY[y]||[]).push({x:it.transform[4],s:it.str});
    });
    Object.keys(byY).sort((a,b)=>b-a).forEach(y=>{
      lines.push(byY[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(" "));
    });
  }
  if(lines.join("").trim().length===0)throw new Error("PDF senza testo (scansione): scarica il CSV/XLSX dalla banca");
  const out=[];
  lines.forEach(L=>{
    const dm=L.match(/(\d{1,2}[\/\.]\d{1,2}[\/\.]\d{2,4})/);
    const ams=L.match(/-?\d{1,3}(?:\.\d{3})*,\d{2}/g);
    if(!dm||!ams)return;
    const imp=parseItNum(ams[ams.length-1]);
    if(imp==null||imp===0)return;
    let descr=L.replace(dm[0],"");
    ams.forEach(a=>{descr=descr.replace(a,"");});
    descr=descr.replace(/\s+/g," ").trim();
    if(descr.length<4)return;
    out.push({data:itToISO(dm[0]),descr,importo:Math.abs(imp)});
  });
  return out;
}
async function parseBanca(file){
  if(/\.pdf$/i.test(file.name))return parseBancaPdf(file);
  return parseBancaTabella(file);
}

  const [u,setU]=useState(""),[p,setP]=useState(""),[err,setErr]=useState(""),[busy,setBusy]=useState(false);

    const ul=u.trim().toLowerCase();

    if(ul==="cosimo.spano"&&p==="CS.290881"){

    }
    if(typeof PAY_USE_API!=="undefined" && PAY_USE_API){
      setBusy(true); setErr("");
      try{
        const apiBase=(typeof PAYMENTS_API!=="undefined"?PAYMENTS_API:"http://localhost:3021/api");
        const ri=await fetch(apiBase+"/auth/interno",{
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({username:ul, password:p})
        });
        if(ri.ok){
          const data=await ri.json().catch(()=>({}));
          sessionStorage.setItem("ph_interno_user", data.username||ul);
          sessionStorage.setItem("ph_collab_temp_pw", p);
          sessionStorage.removeItem("ph_collab_user");
          return onLogin({role:"interno", id:data.id, username:data.username, nome:data.nome, mustChange:!!data.mustChange, permessi:data.permessi||{}, ruolo:data.ruolo||"operatore"}, p);
        }
        const r=await fetch(apiBase+"/auth/collaboratore",{
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({username:uu, password:p})
        });
        const data=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(data.detail||"Credenziali non valide");
        sessionStorage.setItem("ph_collab_user", data.username||uu);
        sessionStorage.setItem("ph_collab_temp_pw", p);
        sessionStorage.removeItem("ph_interno_user");

  return <div className="lwrap"><div className="lcard">

function ChangePassword({onDone, username}){
  const [p1,setP1]=useState(""),[p2,setP2]=useState(""),[err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const go=async()=>{
    if(p1.length<8) return setErr("La password deve avere almeno 8 caratteri.");
    if(p1!==p2) return setErr("Le password non coincidono.");
    if(typeof PAY_USE_API!=="undefined" && PAY_USE_API){
      setBusy(true); setErr("");
      try{
        const internoUser=sessionStorage.getItem("ph_interno_user") || "";
        const user=username || internoUser || sessionStorage.getItem("ph_collab_user") || "";
        const attuale=sessionStorage.getItem("ph_collab_temp_pw") || "";
        const ep=internoUser?"/auth/interno/password":"/auth/collaboratore/password";
        const r=await fetch((typeof PAYMENTS_API!=="undefined"?PAYMENTS_API:"http://localhost:3021/api")+ep,{
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({username:user, password_attuale:attuale, password_nuova:p1})
        });
        const data=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(typeof data.detail==="string"?data.detail:"Errore cambio password");
        sessionStorage.removeItem("ph_collab_temp_pw");
        return onDone();
      }catch(e){ setErr(e.message||"Errore cambio password"); }
      finally{ setBusy(false); }
      return;
    }
    onDone();
  };
  return <div className="lwrap"><div className="lcard">
    <img src={LOGO_FULL} alt="Pratiche Soluzioni" style={{display:"block",height:72,margin:"0 auto 18px"}} onError={e=>{e.currentTarget.style.display='none';}}/>
    <div className="sub" style={{textAlign:"center"}}>Primo accesso — imposta una nuova password per continuare</div>
    {err&&<div className="lerr">{err}</div>}
    <div className="lfld"><label>Nuova password</label><input type="password" value={p1} onChange={e=>setP1(e.target.value)} disabled={busy}/></div>
    <div className="lfld"><label>Conferma password</label><input type="password" value={p2} onChange={e=>setP2(e.target.value)} disabled={busy}/></div>
    <button className="lbtn" onClick={go} disabled={busy}>{busy?"Salvataggio…":"Imposta e accedi"}</button>
  </div></div>;
}

    {tab==="prest"&&<div className="infobox">Prestazioni a pagamento: disponibili con API attiva (?api=1).</div>}

function collabListaInattivo(c){
  if(!c) return false;
  const st=String(c.stato||c.stato_scheda||"").toLowerCase();
  if(st==="chiusa") return true;
  return !!(c.data_chiusura_sede||"").trim();
}
function collabListaCmp(a,b,fOrd){
  const ia=collabListaInattivo(a), ib=collabListaInattivo(b);
  if(ia!==ib) return ia?1:-1;
  const ord=fOrd||"nome_az";
  if(ord==="nome_za") return String(b.nome).localeCompare(String(a.nome),"it");
  if(ord==="listino") return String(a.listino||"").localeCompare(String(b.listino||""),"it");
  if(ord==="stato") return String(a.stato||"").localeCompare(String(b.stato||""),"it");
  return String(a.nome).localeCompare(String(b.nome),"it");
}
function Lista({collab,onOpen,onImportAnagrafica,importReport,onNuovoCollab}){
  const [q,setQ]=useState("");
  const [fStato,setFStato]=useState("");
  const [fCaf,setFCaf]=useState("");

  const [fListino,setFListino]=useState("");
  const [fProv,setFProv]=useState("");
  const [fCod,setFCod]=useState("");
  const [fExtra,setFExtra]=useState("");
  const [fOrd,setFOrd]=useState("nome_az");
  const [showFiltri,setShowFiltri]=useState(false);
  const impRef=useRef(null);
  const optsCaf=useMemo(()=>[...new Set(collab.map(c=>(c.tipo_sede||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"it")),[collab]);
  const optsPatr=useMemo(()=>[...new Set(collab.map(c=>(c.stato_caf||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"it")),[collab]);
  const optsListino=useMemo(()=>[...new Set(collab.map(c=>(c.listino||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"it")),[collab]);
  const optsProv=useMemo(()=>[...new Set(collab.map(c=>(c.provincia||"").trim().toUpperCase()).filter(Boolean))].sort(),[collab]);
  const hasFiltri=!!(fStato||fCaf||fPatr||fListino||fProv||fCod||fExtra||q.trim()||fOrd!=="nome_az");
  const resetFiltri=()=>{setQ("");setFStato("");setFCaf("");setFPatr("");setFListino("");setFProv("");setFCod("");setFExtra("");setFOrd("nome_az");};
  const sorted=useMemo(()=>{
    const cmp=typeof payCmpCollabLista==="function"?payCmpCollabLista:collabListaCmp;
    return [...collab].sort((a,b)=>cmp(a,b,"nome_az"));
  },[collab]);
  const list=useMemo(()=>{
    const t=q.trim().toLowerCase();
    const cmp=typeof payCmpCollabLista==="function"?payCmpCollabLista:collabListaCmp;
    return sorted.filter(c=>{
      if(fStato&&c.stato!==fStato) return false;
      if(fCaf&&(c.tipo_sede||"")!==fCaf) return false;
      if(fPatr&&(c.stato_caf||"")!==fPatr) return false;
      if(fListino&&(c.listino||"")!==fListino) return false;
      if(fProv&&(c.provincia||"").toUpperCase()!==fProv) return false;
      if(fCod==="caf"&&!c.codici?.caf) return false;
      if(fCod==="del"&&!c.codici?.del) return false;
      if(fCod==="naspi"&&!c.codici?.naspi) return false;
      if(fCod==="misia"&&!c.codici?.misia) return false;
      if(fCod==="gest"&&!c.codici?.gest) return false;
      if(fCod==="nessuno"&&CK.some(([k])=>c.codici?.[k])) return false;
      if(fExtra==="730"&&!c.f730) return false;
      if(fExtra==="cred"&&!c.utente) return false;
      if(fExtra==="iban"&&!c.iban) return false;
      if(fExtra==="boll"&&bollDovuto(c.tipo_sede,c)&&!bollOk(c.boll?.[2026])) return false;
      if(fExtra==="bollok"&&bollDovuto(c.tipo_sede,c)&&bollOk(c.boll?.[2026])) return false;
      if(fExtra==="chiusura"&&!(c.data_chiusura_sede||"").trim()) return false;
      if(fExtra==="risk"&&trend(c.prod).lvl!=="hi") return false;
      if(fExtra==="gestione"&&!Object.values(c.gestione||{}).some(Boolean)) return false;
      if(!t) return true;
      const hay=[c.nome,c.cognome,c.nome_proprio,c.cf,c.assoc,c.citta,c.localita,c.cap,c.provincia,c.note,c.tipo_sede,c.stato_caf,c.listino,c.incarico,...Object.values(c.codici||{}),...(c.tel||[]),...(c.email||[])].join(" ").toLowerCase();
      return hay.includes(t);
    }).sort((a,b)=>cmp(a,b,fOrd));
  },[q,fStato,fCaf,fPatr,fListino,fProv,fCod,fExtra,fOrd,sorted]);
  return <React.Fragment>
    <div className="top">
      <div><h1>Collaboratori</h1><div className="sub">{collab.length} collaboratori · filtra per stato, CAF, listino, codici, bollettino…</div></div>
      <div style={{display:"flex",gap:8}}>
        <button className="btn btn-g" onClick={()=>impRef.current&&impRef.current.click()}>📥 Importa da Elenco completo</button>

        <button className="btn btn-p" onClick={onNuovoCollab}>+ Nuovo collaboratore</button>
      </div>
    </div>
    <div className="searchwrap"><span className="lens">🔎</span>
      <input className="search" placeholder="Cerca: nome, CF, codice, città, telefono, listino…" value={q} onChange={e=>setQ(e.target.value)}/></div>
    <div style={{display:"flex",gap:8,alignItems:"center",margin:"8px 0 4px",flexWrap:"wrap"}}>
      <button type="button" className="btn btn-g btn-sm" onClick={()=>setShowFiltri(v=>!v)}>
        {showFiltri?"▲ Nascondi filtri":"▼ Filtri e ordine"}{hasFiltri&&!showFiltri?" · attivi":""}
      </button>
      {hasFiltri&&<button type="button" className="btn btn-g btn-sm" onClick={resetFiltri}>Azzera filtri</button>}
    </div>
    {showFiltri&&<div className="lista-filtri">
      <div className="f"><label>Stato</label>
        <select value={fStato} onChange={e=>setFStato(e.target.value)}>
          <option value="">Tutti</option>
          <option value="ok">Attivo</option>
          <option value="open">In apertura</option>
          <option value="warn">Da verificare</option>
          <option value="chiusa">Sede chiusa</option>
        </select></div>
      <div className="f"><label>CAF</label>
        <select value={fCaf} onChange={e=>setFCaf(e.target.value)}>
          <option value="">Tutti</option>
          {optsCaf.map(o=><option key={o} value={o}>{o}</option>)}
        </select></div>
      <div className="f"><label>Patronato</label>
        <select value={fPatr} onChange={e=>setFPatr(e.target.value)}>
          <option value="">Tutti</option>
          {optsPatr.map(o=><option key={o} value={o}>{o}</option>)}
        </select></div>
      <div className="f"><label>Listino</label>
        <select value={fListino} onChange={e=>setFListino(e.target.value)}>
          <option value="">Tutti</option>
          {optsListino.map(o=><option key={o} value={o}>{o}</option>)}
        </select></div>
      <div className="f"><label>Provincia</label>
        <select value={fProv} onChange={e=>setFProv(e.target.value)}>
          <option value="">Tutte</option>
          {optsProv.map(o=><option key={o} value={o}>{o}</option>)}
        </select></div>
      <div className="f"><label>Codice</label>
        <select value={fCod} onChange={e=>setFCod(e.target.value)}>
          <option value="">Tutti</option>
          <option value="caf">Con codice CAF</option>
          <option value="del">Con incarico sindacale</option>
          <option value="naspi">Con codice NASPI</option>
          <option value="misia">Con codice MISIA</option>
          <option value="gest">Con codice Gestione</option>
          <option value="nessuno">Senza codici</option>
        </select></div>
      <div className="f"><label>Altro</label>
        <select value={fExtra} onChange={e=>setFExtra(e.target.value)}>
          <option value="">—</option>
          <option value="730">Abilitati 730</option>
          <option value="cred">Con utenza portale</option>
          <option value="iban">Con IBAN</option>
          <option value="boll">Bollettino 2026 da pagare</option>
          <option value="bollok">Bollettino 2026 OK</option>
          <option value="chiusura">Con data chiusura sede</option>
          <option value="risk">Produzione a rischio</option>
          <option value="gestione">Con permessi gestione</option>
        </select></div>
      <div className="f"><label>Ordine</label>
        <select value={fOrd} onChange={e=>setFOrd(e.target.value)}>
          <option value="nome_az">Nome A→Z (attivi prima)</option>
          <option value="nome_za">Nome Z→A</option>
          <option value="listino">Listino A→Z</option>
          <option value="stato">Stato A→Z</option>
        </select></div>
    </div>}
    {importReport&&<div className="infobox" style={{marginTop:10}}>
      <b>Report import anagrafica</b> · righe lette: <b>{importReport.totaleRighe}</b> · aggiunti: <b style={{color:"#0A7E72"}}>{importReport.aggiunti}</b> · scartati: <b style={{color:"var(--amber)"}}>{importReport.scartati.length}</b>
      {importReport.scartati.length>0&&<div style={{marginTop:8,fontSize:12.5}}>
        {importReport.scartati.slice(0,12).map((s,i)=><div key={i}>riga {s.riga}{s.nome?` · ${s.nome}`:""} → {s.motivo}</div>)}

      </div>}
    </div>}
    <div className="cnt">{list.length} risultat{list.length===1?"o":"i"}{hasFiltri?` su ${collab.length}`:""}</div>
    {list.map(c=><Card key={c.id} c={c} onOpen={onOpen}/>)}
    {list.length===0&&<div className="empty"><div className="big">🔍</div>Nessun risultato. {hasFiltri&&<button className="btn btn-g btn-sm" style={{marginTop:10}} onClick={resetFiltri}>Azzera filtri</button>}</div>}
  </React.Fragment>;
}

function RiconciliazioneRomaPanel({listini}){
  const [romaFile,setRomaFile]=useState(null);
  const [anno,setAnno]=useState(2025);
  const [listino,setListino]=useState("Standard");
  const [soglia,setSoglia]=useState(1);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [audit,setAudit]=useState(null);
  const run=async()=>{
    if(!romaFile){setErr("Carica prima il file Roma RC33 (.xls/.xlsx)");return;}
    setLoading(true); setErr("");
    try{
      const out=await parseRomaTariffAudit(romaFile,anno,listini,listino);
      setAudit(out);
    }catch(e){setErr(e.message||"Errore in riconciliazione");}
    finally{setLoading(false);}
  };
  return <div className="panel" style={{marginBottom:16}}>
    <div className="ph"><h3>Controllo tariffe da file Roma</h3><span style={{fontSize:12,color:"var(--mut)"}}>Confronto voci A-H con tariffario interno</span></div>
    <div style={{padding:14}}>
      <div className="selrow" style={{marginBottom:10}}>
        <select value={anno} onChange={e=>setAnno(+e.target.value)}><option value={2024}>Anno 2024</option><option value={2025}>Anno 2025</option><option value={2023}>Anno 2023</option></select>
        <select value={listino} onChange={e=>setListino(e.target.value)}>{Object.keys(listini||{}).map(n=><option key={n}>{n}</option>)}</select>
        <label style={{display:"flex",alignItems:"center",gap:7,fontSize:12,color:"var(--mut)",fontWeight:700}}>Soglia alert €
          <input value={soglia} onChange={e=>setSoglia(e.target.value)} style={{width:70,border:"1.5px solid var(--line)",borderRadius:8,padding:"6px 8px"}}/>
        </label>
        <button className="btn btn-t" onClick={run} disabled={loading}>{loading?"Elaborazione...":"▶ Calcola controllo"}</button>
      </div>
      <DropZone accept=".xlsx,.xls" onFile={f=>setRomaFile(f)}>
        <b>File Roma (obbligatorio)</b><div className="muted small">{romaFile?romaFile.name:"Carica RC 33 ... .xls"}</div>
      </DropZone>
      {err&&<div className="notebox" style={{marginTop:10}}>{err}</div>}
      {audit&&<React.Fragment>
        <div className="infobox" style={{marginTop:10}}>
          Foglio analizzato: <b>{audit.sheet}</b> · differenze trovate: <b style={{color:"var(--amber)"}}>{audit.diffs}</b> · voci non leggibili/mancanti: <b>{audit.missing}</b>
        </div>
        <table className="tbl" style={{marginTop:10}}>
          <thead><tr><th>Voce</th><th>Sorgente</th><th>Metodo</th><th>Tariffario sistema</th><th>Tariffa rilevata da Roma</th><th>Delta</th><th>Esito</th></tr></thead>
          <tbody>{audit.rows.map((r,i)=>{const al=Number(soglia||1); const bad=(r.diff!=null&&Math.abs(r.diff)>al); return <tr key={i}>
            <td>{r.voce}</td>
            <td className="e">{r.source||"—"}</td>
            <td className="e">{r.method||"—"}</td>
            <td className="e">{eur(r.expected)}</td>
            <td className="e">{r.found==null?"—":eur(r.found)}</td>
            <td className="e">{r.diff==null?"—":eur(r.diff)}</td>
            <td style={{fontWeight:700,color:r.status==="ok"?"#0A7E72":(bad?"var(--red)":"var(--amber)")}}>
              {r.status==="ok"?"OK":(r.status==="diff"?(bad?"Differenza oltre soglia":"Differenza entro soglia"):"Voce non leggibile")}
            </td>
          </tr>;})}</tbody>
        </table>
      </React.Fragment>}
    </div>
  </div>;
}

function ContabilitaView({collab,pagamenti,sanzioni,onAddPag,onTogSanz,onAssociaSanz,onOpenAcconto,flash}){
  const [tab,setTab]=useState("pag");
  const [bank,setBank]=useState(null);
  const byId=id=>collab.find(c=>c.id===id);
  const daAssoc=sanzioni.filter(s=>s.cid===null);
  const simulaBanca=fname=>setBank(BANK_DEMO.map((m,i)=>({...m,id:i,cid:matchBank(m.descr),registrato:false,src:fname||"estratto_demo.csv"})));
  const fileBanca=async f=>{
    try{
      const movs=await parseBanca(f);
      if(!movs.length){flash("Nessun movimento riconosciuto nel file — verifica il formato");return;}
      setBank(movs.map((m,i)=>({...m,id:i,cid:matchBank(m.descr),registrato:false,src:f.name})));
    }catch(e){flash("Estratto non leggibile: "+(e.message||"formato non riconosciuto"));}
  };
  const setBankCid=(i,cid)=>setBank(b=>b.map((m,j)=>j!==i?m:{...m,cid}));
  const registraBanca=()=>{
    const ok=bank.filter(m=>m.cid&&!m.registrato);
    let ins=0,sc=0;
    ok.forEach(m=>{ const done=onAddPag(m.cid,m.importo,"Acconto compensi (da estratto conto)",m.data,true); if(done) ins++; else sc++; });
    setBank(null);
    flash(ins+" movimenti registrati come acconti"+(sc?` · ${sc} bloccati per controllo saldo`:""));
  };
  return <React.Fragment>
    <div className="top"><div><h1>Pagamenti e sanzioni</h1><div className="sub">Registro acconti ai collaboratori e sanzioni da trattenere</div></div></div>
    <div className="tabs2">
      <button className={tab==="pag"?"on":""} onClick={()=>setTab("pag")}>Acconti pagati</button>
      <button className={tab==="banca"?"on":""} onClick={()=>setTab("banca")}>🏦 Importa estratto conto</button>
      <button className={tab==="sanz"?"on":""} onClick={()=>setTab("sanz")}>Sanzioni {daAssoc.length>0&&"("+daAssoc.length+" da associare)"}</button>
    </div>

    {tab==="pag"&&<React.Fragment>
      <div style={{marginBottom:14}}><button className="btn btn-p" onClick={()=>onOpenAcconto(null)}>+ Registra acconto (data modificabile)</button></div>
      <div className="panel">
        <table className="tbl"><thead><tr><th>Data</th><th>Collaboratore</th><th>Anno rif.</th><th>Causale</th><th>Importo</th></tr></thead><tbody>
          {[...pagamenti].sort((a,b)=>b.data.localeCompare(a.data)).map(p=><tr key={p.id}><td>{itDate(p.data)}</td><td className="e" style={{textAlign:"right",fontWeight:600,color:"var(--ink)"}}>{byId(p.cid)?byId(p.cid).nome:"—"}</td><td className="e">{p.anno}</td><td className="e">{p.causale}</td><td style={{fontWeight:700}}>{eur(p.importo)}</td></tr>)}
        </tbody></table></div>
    </React.Fragment>}

    {tab==="banca"&&<React.Fragment>
      {!bank&&<DropZone accept=".csv,.xlsx,.xls,.pdf" onFile={fileBanca}>
        <div className="big">🏦</div>
        Trascina qui l'estratto conto (<b>.csv / .xlsx / .pdf</b>) scaricato dalla banca o <b style={{color:"var(--sky)"}}>clicca per selezionarlo</b> — il file viene letto davvero
        <div style={{marginTop:12}}><button className="btn btn-p" onClick={e=>{e.stopPropagation();simulaBanca();}}>Oppure simula con dati demo</button></div>
        <div style={{fontSize:11.5,marginTop:10}}>Dai PDF il sistema estrae il testo dei movimenti automaticamente · associa i bonifici per nome — dove non c'è corrispondenza certa, scegli tu</div></DropZone>}
      {bank&&<React.Fragment>
        <div style={{fontSize:13.5,marginBottom:12}}>📄 <b>{bank[0].src}</b> — movimenti in uscita trovati: <b>{bank.length}</b> · associati automaticamente: <b style={{color:"#0A7E72"}}>{bank.filter(m=>m.cid&&matchBank(m.descr)===m.cid).length}</b> · da associare manualmente: <b style={{color:"var(--amber)"}}>{bank.filter(m=>!m.cid).length}</b></div>
        {bank.map((m,i)=><div key={m.id} className={"bkrow "+(m.cid?"matched":"um")}>
          <span className="d">{itDate(m.data)}</span>
          <span className="descr">{m.descr}</span>
          <span className="imp">{eur(m.importo)}</span>
          {m.cid?<span className="bkmatch">→ {byId(m.cid).nome} ✓</span>:
            <select defaultValue="" onChange={e=>e.target.value&&setBankCid(i,+e.target.value)}>
              <option value="">Nessuna corrispondenza — associa a…</option>
              {collab.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
            </select>}
          {m.cid&&<button className="btn btn-g btn-sm" onClick={()=>setBankCid(i,null)}>cambia</button>}
        </div>)}
        <div style={{display:"flex",gap:10,marginTop:14}}>
          <button className="btn btn-t" onClick={registraBanca}>✓ Registra {bank.filter(m=>m.cid).length} movimenti come acconti</button>
          <button className="btn btn-g" onClick={()=>setBank(null)}>Annulla</button>
        </div>
      </React.Fragment>}
    </React.Fragment>}

    {tab==="sanz"&&<React.Fragment>
      {daAssoc.length>0&&<div className="unk"><div className="ut">⚠ Sanzioni con zona non riconosciuta — associale a un collaboratore</div>
        {sanzioni.map(s=>s.cid===null?<div className="unkrow" key={s.id}>
          <span className="mono">{s.zona}</span><span style={{fontSize:12,color:"#6B4A00"}}>{eur(s.importo)} · CF {s.cf}</span>
          <select defaultValue="" onChange={e=>e.target.value&&onAssociaSanz(s.id,+e.target.value)}>
            <option value="">Associa a…</option>{collab.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</select>
        </div>:null)}</div>}
      <div className="panel">
        <table className="tbl"><thead><tr><th>Data</th><th>Tipologia</th><th>Zona</th><th>Collaboratore</th><th>Importo</th><th>Stato</th></tr></thead><tbody>
          {sanzioni.map(s=><tr key={s.id}><td>{s.data}</td><td className="e" style={{textAlign:"right"}}>{s.tip}</td><td className="mono e">{s.zona}</td>
            <td className="e" style={{textAlign:"right",fontWeight:600,color:s.cid?"var(--ink)":"var(--amber)"}}>{s.cid?byId(s.cid).nome:"da associare"}</td>
            <td className="neg">− {eur(s.importo)}</td>
            <td><button onClick={()=>onTogSanz(s.id)} className={"spill "+(s.pagata?"si":"no")}>{s.pagata?"Saldata":"Da trattenere"}</button></td></tr>)}
        </tbody></table></div>
    </React.Fragment>}
  </React.Fragment>;
}

/* ============ PRODUZIONE / SCADENZE / COMUNICAZIONI ============ */
function Produzione({collab}){
  const withT=collab.map(c=>({...c,t:trend(c.prod),tot:c.prod.reduce((a,b)=>a+b,0)}));
  const ord={hi:0,md:1,ok:2};
  withT.sort((a,b)=>ord[a.t.lvl]-ord[b.t.lvl]||a.t.pct-b.t.pct);
  const nRisk=withT.filter(c=>c.t.lvl==="hi").length;
  return <React.Fragment>
    <div className="top"><div><h1>Monitoraggio produzione <span className="lockpill">🔒 Solo titolare</span></h1>
      <div className="sub">Andamento pratiche per intercettare cali e rischio abbandono</div></div></div>
    <div className="kpis">
      <div className={"kpi"+(nRisk>0?" alert":"")}><div className="kv">{nRisk}</div><div className="kl">Collaboratori a rischio</div></div>
      <div className="kpi navy"><div className="kv">{withT.reduce((a,c)=>a+c.prod[5],0)}</div><div className="kl">Pratiche ultimo mese</div></div>
      <div className="kpi good"><div className="kv">{withT.filter(c=>c.t.lvl==="ok").length}</div><div className="kl">Stabili o in crescita</div></div>
    </div>
    {withT.map(c=><div key={c.id} className={"prod-card "+c.t.lvl}>
      <div className="who"><div className="n">{c.nome}</div>
        <div className="c">{c.codici.caf?"CAF "+c.codici.caf.replace("*",""):"—"} · {c.tot} pratiche nel periodo</div>
        <div className={"payrow "+(c.pag.reg?"okp":"late")}>{c.pag.reg?"✓ Pagamenti regolari":"● In ritardo"+(c.pag.ins>0?" · insoluto "+eur(c.pag.ins):"")} · ultimo: {c.pag.ult}</div></div>
      <Spark p={c.prod} bad={c.t.lvl==="hi"}/>
      <div className="pstats">
        <div className="pstat"><div className={"v "+(c.t.pct<0?"neg":"pos")}>{c.t.pct>0?"+":""}{c.t.pct}%</div><div className="l">Trend</div></div>
        <div className="pstat"><span className={"riskmini r-"+(c.t.lvl==="hi"?"hi":c.t.lvl==="md"?"md":"ok")}>{c.t.lvl==="hi"?"📉 ":c.t.lvl==="md"?"↘ ":"✓ "}{c.t.lbl}</span></div>
      </div></div>)}
  </React.Fragment>;
}

function GestioneFiltrata({view,me,collab,pagamenti,sanzioni,batches,listini,onAddPag,onTogSanz,onAssociaSanz,onOpenAcconto,flash,onSimula,onFileImport,anteprima,onConferma,onIgnoraVoce,onRicalcolaImport,onEliminaImport,toast,onEditTarif,onNuovo,detMap,onRecalcCompensi}){

  if(view==="g_tar")return <TariffarioView listini={listini} collab={soloMe} onEdit={onEditTarif} onNuovo={onNuovo}/>;
  if(view==="g_prod")return <Produzione collab={soloMe}/>;
  if(view==="g_cont")return <ContabilitaView collab={soloMe} pagamenti={pagamenti} sanzioni={sanzioni} onAddPag={onAddPag} onTogSanz={onTogSanz} onAssociaSanz={onAssociaSanz} onOpenAcconto={onOpenAcconto} flash={flash}/>;
  return <div className="empty"><div className="big">🔒</div>Sezione non disponibile.</div>;
}

function StatusBadge({st,sm}){

    <span className="dotst" style={{background:s.color}}/>{s.label}</span>;
}
function ModalP({title,onClose,children,wide}){
  return <div className="modal-bg" onClick={onClose}>
    <div className={"modal"+(wide?" wide":"")} onClick={e=>e.stopPropagation()}>

function AccessPopup({info,onClose,go}){

function DatiModulo({p,tpl}){

    {tpl.fields.map(f=>(
      <tr key={f.id}><td className="muted" style={{textAlign:"left",width:"45%"}}>{f.label}</td><td style={{textAlign:"left"}}><b>{p.fieldValues?.[f.id]||"—"}</b></td></tr>

function AuditLog({p}){
  const log=(p.audit||[]).slice().reverse();

  return <div>
    {log.map((a,i)=>(
      <div key={i} className="filecard">
        <div className="doc-ic" style={{background:"#eef2fa"}}>•</div>
        <div style={{flex:1}}><div style={{fontWeight:600}}>{a.action}</div><div className="muted small">{a.actor} · {fmtDT(a.ts)}</div></div>
      </div>
    ))}
  </div>;
}
function Timeline({p}){
  const hist=p.statusHistory||[];
  return <div>
    {FLOW.map((s,i)=>{
      const h=hist.find(x=>x.status===s);
      return <div className="timeline-row" key={s}>
        <div className="tline"/>
        <div className="tdot" style={{background:h?"var(--sky)":"#D5DEEC"}}/>
        <div>
          <div className="tt" style={{color:h?"var(--ink)":"var(--mut)"}}>{STATUSES[s].label}</div>
          {h && <div className="ts">{fmtDT(h.ts)}{h.note?" · "+h.note:""}</div>}
        </div>
      </div>;
    })}
  </div>;
}
/* ============================== PRATICHE — UFFICIO/TITOLARE — LISTA ============================== */
function OfficePratiche({pData,setPData,collab,go,me,onlyMe}){
  const [f,setF]=useState("tutte");
  const [fc,setFc]=useState("tutti");
  const [ft,setFt]=useState("tutti");
  const [q,setQ]=useState("");
  const scope = onlyMe ? collab.filter(c=>c.id===onlyMe) : collab;
  const list = pData.pratiche.filter(p=> (p.status!=="bozza" || p.collaboratorId) && (!onlyMe || p.collaboratorId===onlyMe) );
  const ql=q.trim().toLowerCase();
  const visible = list.filter(p=>
    (f==="tutte"||p.status===f) &&
    (fc==="tutti"||p.collaboratorId===fc) &&
    (ft==="tutti"||p.templateId===ft) &&
    (!ql || (p.code+" "+(p.assistito||"")).toLowerCase().includes(ql))
  );
  const counts = {
    inviata:list.filter(p=>p.status==="inviata").length,
    in_lavorazione:list.filter(p=>p.status==="in_lavorazione").length,
    richiesta_documenti:list.filter(p=>p.status==="richiesta_documenti").length,
    trasmessa:list.filter(p=>p.status==="trasmessa").length,
  };
  const resetF=()=>{setF("tutte");setFc("tutti");setFt("tutti");setQ("");};

  return <>
    <div className="top"><div><h1>📁 Pratiche</h1><div className="sub">{onlyMe?"Le pratiche che ti sono assegnate":"Tutte le pratiche dello studio"}</div></div></div>
    <div className="kpis">
      <div className="kpi"><div className="kv">{list.length}</div><div className="kl">Pratiche totali</div></div>

      <div className="kpi alert"><div className="kv">{counts.richiesta_documenti}</div><div className="kl">In attesa documenti</div></div>
      <div className="kpi good"><div className="kv">{counts.trasmessa}</div><div className="kl">Trasmesse</div></div>
    </div>
    <div className="panel">
      <div className="ph">
        <input className="search" style={{maxWidth:240,padding:"10px 14px"}} placeholder="🔍 Cerca codice o assistito..." value={q} onChange={e=>setQ(e.target.value)}/>
        <select className="chip" style={{maxWidth:190,padding:"9px 13px"}} value={f} onChange={e=>setF(e.target.value)}>
          <option value="tutte">Tutti gli stati</option>
          {FLOW.map(s=><option key={s} value={s}>{STATUSES[s].label}</option>)}
        </select>
        {!onlyMe && <select className="chip" style={{maxWidth:200,padding:"9px 13px"}} value={fc} onChange={e=>setFc(e.target.value)}>
          <option value="tutti">Tutti i collaboratori</option>
          {scope.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>}
        <select className="chip" style={{maxWidth:220,padding:"9px 13px"}} value={ft} onChange={e=>setFt(e.target.value)}>
          <option value="tutti">Tutti i tipi</option>
          {pData.templates.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        {anyF && <button className="btn btn-g btn-sm" onClick={resetF}>✕ Azzera filtri</button>}
        <span className="cnt" style={{marginLeft:"auto",marginBottom:0}}>{visible.length} pratiche</span>
      </div>
      <div className="pad" style={{paddingTop:0}}>
      {visible.length===0 ? <div className="empty"><div className="big">📭</div>Nessuna pratica con questi filtri.</div> :
      <table className="tbl">
        <thead><tr><th style={{textAlign:"left"}}>Codice</th><th style={{textAlign:"left"}}>Tipo</th><th style={{textAlign:"left"}}>Assistito</th>{!onlyMe&&<th style={{textAlign:"left"}}>Collaboratore</th>}<th style={{textAlign:"left"}}>Stato</th><th style={{textAlign:"left"}}>Aggiornata</th></tr></thead>

              <td style={{textAlign:"left"}}>{tpl?tpl.name:"—"}</td>

      </div>

  </>;

function OfficeDetail({pData,setPData,collab,go,toast,id,meId}){
  const p = pData.pratiche.find(x=>x.id===id);
  if(!p) return <div className="empty">Pratica non trovata.</div>;
  const tpl=pData.templates.find(t=>t.id===p.templateId);
  const c=collab.find(u=>u.id===p.collaboratorId);
  const [tab,setTab]=useState("documenti");
  const [reqOpen,setReqOpen]=useState(false);
  const [reqNote,setReqNote]=useState("");
  const ricevutaInput=useRef();

  function update(mut){
    setPData(d=>({...d,pratiche:d.pratiche.map(x=>{ if(x.id!==id)return x; const cc={...x}; mut(cc); cc.updatedAt=Date.now(); return cc; })}));
  }
  function addAudit(cc,action){ cc.audit=[...(cc.audit||[]),{ts:Date.now(),actor:"Ufficio",action}]; }
  function postMessage(text){
    update(cc=>{ cc.messages=[...(cc.messages||[]),{id:nid("m_"),authorId:meId,authorName:"Ufficio",role:"titolare",text,ts:Date.now()}]; cc.chatReadBy={...(cc.chatReadBy||{}),[meId]:Date.now()}; });
  }
  useEffect(()=>{ setPData(d=>({...d,pratiche:d.pratiche.map(x=>{
    if(x.id!==id) return x;
    const now=Date.now();
    const messages=(x.messages||[]).map(m=> (m.authorId!==meId && !(m.readBy&&m.readBy[meId])) ? {...m,readBy:{...(m.readBy||{}),[meId]:now}} : m);
    return {...x,messages};
  })})); },[id]);

  function setStatus(st,note){
    update(cc=>{ cc.status=st; cc.statusHistory=[...(cc.statusHistory||[]),{status:st,ts:Date.now(),note:note||""}]; addAudit(cc,"Stato → "+STATUSES[st].label);});
    toast("Stato aggiornato: "+STATUSES[st].label+" · email inviata a "+(c?c.nome:"collaboratore"));
  }

  async function uploadRicevute(files){
    const arr=[];
    for(const f of files){ arr.push({id:nid("r_"),name:f.name,size:f.size,blob:f,uploadedAt:Date.now(),hash:(await sha256(f)).slice(0,16)}); }
    update(cc=>{ cc.ricevute=[...(cc.ricevute||[]),...arr]; addAudit(cc,arr.length+" ricevuta/e caricata/e");
      if(cc.status!=="ricevute_disponibili"){ cc.status="ricevute_disponibili"; cc.statusHistory=[...(cc.statusHistory||[]),{status:"ricevute_disponibili",ts:Date.now(),note:"Ricevute caricate"}]; }});
    toast("Ricevute caricate · stato impostato su \"Ricevute disponibili\"");
  }

  async function zipAll(){
    const zip=new JSZip();
    (p.files||[]).forEach(f=> zip.file(f.name, f.blob));
    const blob=await zip.generateAsync({type:"blob"});
    downloadBlob(blob, p.code+"_documenti.zip");
    toast("Archivio ZIP generato");
  }

  const docFiles=p.files||[];

  return <>
    <button className="btn btn-g btn-sm" onClick={()=>go("office_pratiche")} style={{marginBottom:14}}>← Pratiche</button>
    <div className="panel pad" style={{marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <div className="muted small">{tpl?tpl.ente:""} · {tpl?tpl.name:""}</div>
          <h2 style={{margin:"4px 0 6px"}}>{p.code} — {p.assistito||"Assistito"}</h2>
          <div className="muted small">Collaboratore: <b style={{color:"var(--ink)"}}>{c?c.nome:"—"}</b> · Creata {fmtDT(p.createdAt)} · Inviata {fmtDT(p.submittedAt)}</div>
        </div>
        <StatusBadge st={p.status}/>
      </div>
    </div>

    <div className="grid2">
      <div>
        <div className="panel">
          <div className="tabs" style={{padding:"0 18px"}}>
            <button className={tab==="documenti"?"on":""} onClick={()=>setTab("documenti")}>Documenti ({docFiles.length})</button>
            <button className={tab==="dati"?"on":""} onClick={()=>setTab("dati")}>Dati modulo</button>
            <button className={tab==="ricevute"?"on":""} onClick={()=>setTab("ricevute")}>Ricevute ({(p.ricevute||[]).length})</button>
            <button className={tab==="log"?"on":""} onClick={()=>setTab("log")}>Registro</button>
          </div>
          <div className="pad">
            {tab==="documenti" && <>
              {docFiles.length===0? <div className="empty"><div className="big">📄</div>Nessun documento caricato.</div> : <>
                <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
                  <button className="btn btn-g btn-sm" onClick={zipAll}>🗜️ Scarica tutto (ZIP)</button>
                </div>
                {docFiles.map(f=>(
                  <div className="filecard" key={f.id}>
                    <div className="doc-ic uploaded">📎</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis"}}>{f.name}
                        {f.addedAfterSubmit && <span className="pill use" style={{marginLeft:8}}>integrazione</span>}</div>
                      <div className="muted small">{f.slotLabel||"Documento"} · {human(f.size)} · {fmtDT(f.uploadedAt)}</div>
                      <div style={{marginTop:3}}><span className="hashtag" title="Impronta SHA-256 al momento dell'invio">🔒 {f.hash}</span></div>
                    </div>
                    <button className="btn btn-g btn-sm" onClick={()=>downloadBlob(f.blob,f.name)}>Scarica</button>
                  </div>
                ))}
              </>}
            </>}
            {tab==="dati" && <DatiModulo p={p} tpl={tpl}/>}
            {tab==="ricevute" && <>
              <input ref={ricevutaInput} type="file" multiple style={{display:"none"}} onChange={e=>{uploadRicevute([...e.target.files]); e.target.value="";}}/>
              <button className="btn btn-t btn-sm" onClick={()=>ricevutaInput.current.click()} style={{marginBottom:12}}>📥 Carica ricevuta</button>
              {(p.ricevute||[]).length===0? <p className="muted">Nessuna ricevuta caricata. Quando ne carichi una, lo stato passa automaticamente a "Ricevute disponibili" e il collaboratore riceve l'email.</p> :
                (p.ricevute||[]).map(r=>(
                  <div className="filecard" key={r.id}>
                    <div className="doc-ic" style={{background:"#e7f6ec",color:"#0a6b2e"}}>🧾</div>
                    <div style={{flex:1}}><div style={{fontWeight:600}}>{r.name}</div><div className="muted small">{human(r.size)} · {fmtDT(r.uploadedAt)}</div></div>
                    <button className="btn btn-g btn-sm" onClick={()=>downloadBlob(r.blob,r.name)}>Scarica</button>
                  </div>
                ))}
            </>}
            {tab==="log" && <AuditLog p={p}/>}
          </div>
        </div>
      </div>

      <div>
        <div className="panel pad" style={{marginBottom:14}}>
          <h4 style={{margin:"0 0 12px"}}>Gestione stato</h4>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <button className="btn btn-sky btn-sm" disabled={p.status==="in_lavorazione"} onClick={()=>setStatus("in_lavorazione")}>▶︎ Prendi in carico</button>
            <button className="btn btn-r btn-sm" onClick={()=>{setReqNote("");setReqOpen(true);}}>📋 Richiedi documenti</button>
            <button className="btn btn-t btn-sm" disabled={p.status==="trasmessa"||p.status==="ricevute_disponibili"} onClick={()=>setStatus("trasmessa")}>✓ Segna trasmessa</button>
          </div>
          <div className="lock-box" style={{marginTop:14}}>
            <span>🔒</span><div>I documenti inviati sono <b>bloccati</b>. In "Richiesta documenti" il collaboratore può <b>solo aggiungere</b> nuovi file, mai sostituire quelli esistenti.</div>
          </div>
        </div>
        <div className="panel pad">
          <h4 style={{margin:"0 0 12px"}}>Avanzamento</h4>
          <Timeline p={p}/>
        </div>
        {c && (c.tel?.[0]||c.email?.[0]||c.cf) && <div className="panel pad" style={{marginTop:14}}>
          <h4 style={{margin:"0 0 10px"}}>Contatti collaboratore</h4>
          <div className="muted small" style={{lineHeight:1.9}}>
            <div><b style={{color:"var(--ink)"}}>{c.nome}</b></div>
            {c.tel?.[0] && <div>📞 {c.tel[0]}</div>}
            {c.email?.[0] && <div>✉️ {c.email[0]}</div>}
            {c.citta && <div>📍 {c.citta}</div>}
            {c.cf && <div>🆔 {c.cf}</div>}
          </div>
        </div>}
        <div className="panel pad" style={{marginTop:14}}>
          <h4 style={{margin:"0 0 8px"}}>💬 Chat pratica</h4>
          <PraticaChat p={p} meId={meId} meName="Ufficio" meRole="titolare" onSend={postMessage}/>
        </div>
      </div>
    </div>

    {reqOpen && <ModalP title="Richiedi documenti al collaboratore" onClose={()=>setReqOpen(false)}>
      <p style={{marginTop:0}} className="muted">Scrivi quali documenti mancano o cosa va corretto. Il collaboratore vedrà questa nota e potrà <b>aggiungere</b> i file richiesti, senza toccare quelli già inviati.</p>
      <textarea className="formrow" style={{width:"100%",border:"1.5px solid var(--line)",borderRadius:9,padding:"9px 11px"}} rows={4} value={reqNote} onChange={e=>setReqNote(e.target.value)} placeholder="Es. Manca la seconda busta paga; il documento d'identità è illeggibile."/>
      <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:16}}>
        <button className="btn btn-g" onClick={()=>setReqOpen(false)}>Annulla</button>
        <button className="btn btn-r" onClick={()=>{setStatus("richiesta_documenti",reqNote);setReqOpen(false);}}>📋 Invia richiesta</button>
      </div>
    </ModalP>}
  </>;
}
