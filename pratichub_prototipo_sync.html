  const setF=(i,patch)=> setT(s=>({...s,fields:s.fields.map((f,j)=>j===i?{...f,...patch}:f)}));
  const addF=()=> setT(s=>({...s,fields:[...s.fields,{id:nid("f_"),label:"Nuovo campo",type:"text",required:false}]}));
  const delF=(i)=> setT(s=>({...s,fields:s.fields.filter((_,j)=>j!==i)}));

/* editor del modello standard di un singolo documento (lato ufficio) */
function ModelEditor({doc,onClose,onSave}){
  const [kind,setKind]=useState(doc.model?doc.model.kind:"file");
  const [body,setBody]=useState(doc.model&&doc.model.kind==="text"?doc.model.body:DEFAULT_DOC_BODY);
  const [file,setFile]=useState(doc.model&&doc.model.kind==="file"?{fileName:doc.model.fileName,blob:doc.model.blob}:null);
  function save(){
    if(kind==="file"){ if(!file){onClose();return;} onSave({kind:"file",fileName:file.fileName,blob:file.blob}); }
    else onSave({kind:"text",body});
  }
  return <ModalP title={"Modello standard — "+doc.label} onClose={onClose}>
    <div className="chips" style={{marginBottom:14}}>
      <button className={"chip"+(kind==="file"?" on":"")} onClick={()=>setKind("file")}>Carica file</button>
      <button className={"chip"+(kind==="text"?" on":"")} onClick={()=>setKind("text")}>Modello testo (precompilabile)</button>
    </div>
    {kind==="file" ? <>
      <p className="muted small" style={{marginTop:0}}>Carica il modulo standard (Word, PDF...). Il collaboratore lo scarica così com'è, lo compila e lo fa firmare al cliente.</p>
      <label className="btn btn-g" style={{cursor:"pointer",display:"inline-flex"}}>📎 Scegli file<input type="file" style={{display:"none"}} onChange={e=>{const f=e.target.files[0]; if(f)setFile({fileName:f.name,blob:f}); e.target.value="";}}/></label>
      {file && <div className="filecard" style={{marginTop:10}}><div className="doc-ic">📎</div><div style={{flex:1}}>{file.fileName}</div></div>}
    </> : <>
      <div className="infobox" style={{marginBottom:12}}>Segnaposto compilati con i dati anagrafici del collaboratore: <span className="hashtag">{"{{cognome}}"}</span> <span className="hashtag">{"{{nome}}"}</span> <span className="hashtag">{"{{codice_fiscale}}"}</span> <span className="hashtag">{"{{luogo_nascita}}"}</span> <span className="hashtag">{"{{data_nascita}}"}</span> <span className="hashtag">{"{{indirizzo}}"}</span> <span className="hashtag">{"{{data_firma}}"}</span></div>
      <textarea className="search" rows={10} value={body} onChange={e=>setBody(e.target.value)} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,padding:"10px 13px",width:"100%"}}/>
    </>}
    <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:16}}>
      <button className="btn btn-g" onClick={onClose}>Annulla</button>
      <button className="btn btn-p" onClick={save}>Salva modello</button>
    </div>
  </ModalP>;
}

/* checklist documenti riutilizzabile (nuova pratica + bozza) */
function DocChecklist({tpl,getFiles,onAdd,onRemove,canEdit,fieldValues,toast}){
  function dlModel(d){
    if(!d.model) return;
    if(d.model.kind==="file"){ downloadBlob(d.model.blob,d.model.fileName); }
    else { downloadDoc(d.label, fillBody(d.model.body,fieldValues)); }
    if(toast) toast("Modello scaricato"+(d.model.kind==="text"?" e precompilato":""));
  }
  return <>{["obbligatorio","utile","opzionale"].map(cat=>{
    const list=tpl.docs.filter(d=>d.cat===cat); if(!list.length) return null;
    const pillc=cat==="obbligatorio"?"req":cat==="utile"?"use":"opt";
    return <div key={cat} style={{marginBottom:8}}>
      <div style={{margin:"10px 0 4px"}}><span className={"pill "+pillc}>{cat}</span></div>
      {list.map(d=>{
        const fs=getFiles(d.id)||[];
        return <div className="filecard" key={d.id}>
          <div className={"doc-ic "+(fs.length?"uploaded":"")} style={!fs.length&&cat==="obbligatorio"?{background:"var(--redbg)"}:{}}>{fs.length?"✓":"+"}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600}}>{d.label}</div>
            {d.model && <div className="muted small" style={{marginTop:2}}>{d.model.kind==="file"?"📎 Modello: "+d.model.fileName:"📝 Modello precompilabile disponibile"}</div>}
            {fs.map((fl,i)=>(
              <div className="muted small" key={i} style={{display:"flex",gap:8,alignItems:"center"}}>📎 {fl.name} ({human(fl.size)}) {canEdit && <button className="btn btn-g btn-sm" style={{padding:"2px 7px"}} onClick={()=>onRemove(d.id,i,fl)}>×</button>}</div>
            ))}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
            {d.model && <button className="btn btn-g btn-sm" onClick={()=>dlModel(d)}>📥 Modello</button>}
            {canEdit && <label className="btn btn-g btn-sm" style={{cursor:"pointer"}}>Allega<input type="file" multiple style={{display:"none"}} onChange={e=>{onAdd(d.id,[...e.target.files]);e.target.value="";}}/></label>}
          </div>
        </div>;
      })}
    </div>;
  })}</>;
}

/* ============================== CHAT DI PRATICA ============================== */
function PraticaChat({p,meId,meName,meRole,onSend}){
  const [text,setText]=useState("");
  const msgs=p.messages||[];
  const endRef=useRef();
  useEffect(()=>{ if(endRef.current) endRef.current.scrollIntoView({block:"nearest"}); },[msgs.length]);
  function send(){ const t=text.trim(); if(!t)return; onSend(t); setText(""); }
  return <div>
    <div className="chatbox">
      {msgs.length===0 && <p className="muted small" style={{margin:"6px 0"}}>Nessun messaggio. Usa la chat per comunicazioni intermedie su questa pratica (senza dover telefonare).</p>}
      {msgs.map(m=>{
        const mine=m.authorId===meId;
        let readTs=null;
        if(m.readBy){ for(const uid in m.readBy){ if(uid!==m.authorId){ readTs=m.readBy[uid]; break; } } }
        return <div key={m.id} className={"chatmsg "+(mine?"me":"them")}>
          <div style={{whiteSpace:"pre-wrap"}}>{m.text}</div>
          <div className="cm-meta">
            {m.authorName}{m.role==="titolare"?" (ufficio)":""} · {fmtDT(m.ts)}
            {mine && (readTs? " · visualizzato":" · consegnato")}
          </div>
        </div>;
      })}
      <div ref={endRef}/>
    </div>
    <div className="chatform">
      <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")send();}} placeholder="Scrivi un messaggio..."/>
      <button className="btn btn-p btn-sm" onClick={send}>Invia</button>
    </div>
  </div>;
}

    <div className="panel">

        <select className="chip" style={{maxWidth:200,padding:"9px 13px"}} value={f} onChange={e=>setF(e.target.value)}>
          <option value="tutte">Tutti gli stati</option>
          <option value="bozza">Bozza</option>
          {FLOW.map(s=><option key={s} value={s}>{STATUSES[s].label}</option>)}
        </select>
        <span className="cnt" style={{marginLeft:"auto",marginBottom:0}}>{mine.length} pratiche</span>
      </div>
      <div className="pad" style={{paddingTop:0}}>
      {mine.length===0? <div className="empty"><div className="big">📭</div>Nessuna pratica con questi filtri.</div> :
      <table className="tbl">
        <thead><tr><th style={{textAlign:"left"}}>Codice</th><th style={{textAlign:"left"}}>Tipo</th><th style={{textAlign:"left"}}>Assistito</th><th style={{textAlign:"left"}}>Stato</th><th style={{textAlign:"left"}}>Aggiornata</th></tr></thead>
        <tbody>{mine.map(p=>{
          const tpl=pData.templates.find(t=>t.id===p.templateId);
          return <tr className="clk" key={p.id} onClick={()=>go("collab_detail",{id:p.id})}>
            <td style={{textAlign:"left"}}><b>{p.code}</b>{unreadChat(p,me.id)>0 && <span className="pill" style={{marginLeft:8,background:"var(--redbg)",color:"var(--red)"}}>💬</span>}</td>
            <td style={{textAlign:"left"}}>{tpl?tpl.name:"—"}</td><td style={{textAlign:"left"}}>{p.assistito||"—"}</td>
            <td style={{textAlign:"left"}}><StatusBadge st={p.status} sm/></td><td className="muted small" style={{textAlign:"left"}}>{fmtDT(p.updatedAt)}</td>
          </tr>;
        })}</tbody>
      </table>}
      </div>
    </div>}
  </>;
}

/* ============================== COLLAB — NUOVA PRATICA ============================== */
function CollabNew({pData,setPData,me,go,toast}){
  const [step,setStep]=useState(1);
  const [tplId,setTplId]=useState(null);
  const [assistito,setAssistito]=useState("");
  const [values,setValues]=useState({});
  const [files,setFiles]=useState({});
  const tpl=pData.templates.find(t=>t.id===tplId);

  function pick(tid){ setTplId(tid); setStep(2); }
  function onFile(docId,fl){ setFiles(f=>({...f,[docId]:[...(f[docId]||[]),...fl]})); }
  function rmFile(docId,i){ setFiles(f=>({...f,[docId]:f[docId].filter((_,j)=>j!==i)})); }

  const reqMissing = tpl? tpl.docs.filter(d=>d.cat==="obbligatorio" && !(files[d.id]&&files[d.id].length)) : [];
  const fieldMissing = tpl? tpl.fields.filter(f=>f.required && !values[f.id]) : [];

  function previewDoc(){
    if(!tpl) return;
    downloadDoc(tpl.docTitle, fillBody(tpl.docBody, values));
    toast("Modulo precompilato generato (apri e stampa in PDF)");
  }

  async function submit(asDraft){
    const fileObjs=[];
    for(const d of tpl.docs){ for(const fl of (files[d.id]||[])){ fileObjs.push({id:nid("f_"),name:fl.name,size:fl.size,blob:fl,slotId:d.id,slotLabel:d.label,uploadedAt:Date.now(),hash:(await sha256(fl)).slice(0,16)}); } }
    const code = (tpl.ente==="INAIL"?"INAIL":"INPS")+"-"+String(Date.now()).slice(-5);
    const now=Date.now();
    const p={
      id:nid("p_"), code, templateId:tpl.id, collaboratorId:me.id, assistito:assistito||"(senza nome)",
      fieldValues:values, files:fileObjs, ricevute:[], messages:[], chatReadBy:{[me.id]:Date.now()},
      status: asDraft?"bozza":"inviata", createdAt:now, updatedAt:now, submittedAt: asDraft?null:now,
      statusHistory: asDraft?[{status:"bozza",ts:now}]:[{status:"inviata",ts:now,note:"Inviata dal collaboratore"}],
      audit:[{ts:now,actor:me.nome,action:asDraft?"Bozza salvata":"Pratica inviata e bloccata"}],
    };
    setPData(d=>({...d,pratiche:[...d.pratiche,p]}));
    toast(asDraft?"Bozza salvata":"Pratica inviata · ora è bloccata e non più modificabile");
    go("collab_detail",{id:p.id});
  }

  return <>
    <button className="btn btn-g btn-sm" onClick={()=>go("collab_pratiche")} style={{marginBottom:14}}>← Le mie pratiche</button>

    {step===1 && <>
      <h3 style={{marginTop:0}}>Che tipo di pratica vuoi caricare?</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        {pData.templates.map(t=>(
          <div className="panel pad" key={t.id} style={{cursor:"pointer",marginBottom:0}} onClick={()=>pick(t.id)}>
            <span className="pill" style={{background:t.ente==="INAIL"?"var(--tealbg)":"#e6f1fb",color:t.ente==="INAIL"?"#0a7d70":"var(--navy)"}}>{t.ente}</span>
            <h4 style={{margin:"10px 0 4px"}}>{t.name}</h4>
            <div className="muted small">{t.docs.filter(d=>d.cat==="obbligatorio").length} documenti obbligatori · {t.fields.length} campi</div>
          </div>
        ))}
      </div>
    </>}

    {step===2 && tpl && <>
      <div className="panel pad" style={{marginBottom:16}}>
        <span className="pill" style={{background:"#eef2fa",color:"var(--navy)"}}>{tpl.ente} · {tpl.name}</span>
        <h3 style={{margin:"10px 0 0"}}>Dati del modulo</h3>
        <div className="field-row" style={{marginTop:14}}>
          <label>Nome assistito (riferimento pratica)</label>
          <input className="search" style={{padding:"10px 13px"}} value={assistito} onChange={e=>setAssistito(e.target.value)} placeholder="Es. Giuseppe Conte"/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          {tpl.fields.map(f=>(
            <div className="field-row" key={f.id}>
              <label>{f.label}{f.required && <span style={{color:"var(--red)"}}> *</span>}</label>
              <input className="search" style={{padding:"10px 13px"}} type={f.type==="number"?"number":f.type==="date"?"date":"text"} value={values[f.id]||""} onChange={e=>setValues(v=>({...v,[f.id]:e.target.value}))}/>
            </div>
          ))}
        </div>
        <div style={{marginTop:6}}>
          <button className="btn btn-g btn-sm" onClick={previewDoc}>📄 Genera modulo precompilato (PDF)</button>
        </div>
      </div>

      <div className="panel pad" style={{marginBottom:16}}>
        <h3 style={{marginTop:0}}>Documenti da allegare</h3>
        <p className="muted small" style={{marginTop:0}}>Dove l'ufficio ha caricato un modello standard, puoi scaricarlo (anche precompilato con i dati sopra), farlo firmare e ricaricarlo.</p>
        <DocChecklist tpl={tpl} canEdit={true} fieldValues={values} toast={toast}
          getFiles={(idd)=>files[idd]||[]}
          onAdd={(idd,fl)=>onFile(idd,fl)}
          onRemove={(idd,i)=>rmFile(idd,i)} />
      </div>

      <div className="lock-box" style={{marginBottom:16}}>
        <span>🔒</span><div><b>Attenzione:</b> dopo l'invio la pratica viene <b>bloccata</b>. Non potrai più sostituire o eliminare i documenti caricati (potrai solo aggiungerne se l'ufficio te li richiede). Verifica bene prima di inviare.</div>
      </div>

      {(reqMissing.length>0||fieldMissing.length>0) && <div className="infobox" style={{marginBottom:16}}>
        Prima di inviare mancano: {fieldMissing.map(f=>f.label).concat(reqMissing.map(d=>d.label)).join(", ")}. Puoi comunque salvare come bozza.
      </div>}

      <div style={{display:"flex",justifyContent:"space-between"}}>
        <button className="btn btn-g" onClick={()=>setStep(1)}>← Cambia tipo</button>
        <div style={{display:"flex",gap:10}}>
          <button className="btn btn-g" onClick={()=>submit(true)}>💾 Salva bozza</button>
          <button className="btn btn-t" disabled={reqMissing.length>0||fieldMissing.length>0} onClick={()=>submit(false)}>🔒 Invia pratica</button>
        </div>
      </div>

/* ============================== COLLAB — DETTAGLIO PRATICA ============================== */
function CollabDetail({pData,setPData,me,go,toast,id}){
  const p=pData.pratiche.find(x=>x.id===id);
  if(!p) return <div className="empty">Pratica non trovata.</div>;
  const tpl=pData.templates.find(t=>t.id===p.templateId);
  const editable=canEditFreely(p.status);
  const append=canAppend(p.status);
  const reqMissing = tpl? tpl.docs.filter(d=>d.cat==="obbligatorio" && !((p.files||[]).some(f=>f.slotId===d.id))) : [];

  function update(mut){ setPData(d=>({...d,pratiche:d.pratiche.map(x=>{if(x.id!==id)return x;const c={...x};mut(c);c.updatedAt=Date.now();return c;})})); }

  async function addBozzaFiles(slotId,fl){
    const slot=tpl.docs.find(d=>d.id===slotId);
    const arr=[];
    for(const f of fl){ arr.push({id:nid("f_"),name:f.name,size:f.size,blob:f,slotId,slotLabel:slot?slot.label:"Documento",uploadedAt:Date.now(),hash:(await sha256(f)).slice(0,16)}); }
    update(c=>{ c.files=[...(c.files||[]),...arr]; });
  }
  function removeFile(fid){ update(c=>c.files=c.files.filter(x=>x.id!==fid)); }
  function postMessage(text){
    update(c=>{ c.messages=[...(c.messages||[]),{id:nid("m_"),authorId:me.id,authorName:me.nome,role:"collab",text,ts:Date.now()}]; c.chatReadBy={...(c.chatReadBy||{}),[me.id]:Date.now()}; });
    toast("Messaggio inviato all'ufficio");
  }
  useEffect(()=>{ setPData(d=>({...d,pratiche:d.pratiche.map(x=>{
    if(x.id!==id) return x;
    const now=Date.now();
    const messages=(x.messages||[]).map(m=> (m.authorId!==me.id && !(m.readBy&&m.readBy[me.id])) ? {...m,readBy:{...(m.readBy||{}),[me.id]:now}} : m);
    return {...x,messages};
  })})); },[id]);

  async function addFiles(fl){
    const arr=[];
    for(const f of fl){ arr.push({id:nid("f_"),name:f.name,size:f.size,blob:f,slotLabel:"Integrazione",uploadedAt:Date.now(),hash:(await sha256(f)).slice(0,16),addedAfterSubmit:true}); }
    update(c=>{ c.files=[...(c.files||[]),...arr]; c.audit=[...(c.audit||[]),{ts:Date.now(),actor:me.nome,action:arr.length+" documento/i integrato/i"}];});
    toast("Documenti aggiunti alla pratica");
  }
  function submitDraft(){
    if(reqMissing.length){ toast("Mancano documenti obbligatori"); return; }
    update(c=>{ c.status="inviata"; c.submittedAt=Date.now(); c.statusHistory=[...(c.statusHistory||[]),{status:"inviata",ts:Date.now(),note:"Inviata dal collaboratore"}]; c.audit=[...(c.audit||[]),{ts:Date.now(),actor:me.nome,action:"Pratica inviata e bloccata"}];});
    toast("Pratica inviata · ora è bloccata");
  }

  return <>
    <button className="btn btn-g btn-sm" onClick={()=>go("collab_pratiche")} style={{marginBottom:14}}>← Le mie pratiche</button>
    <div className="panel pad" style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <div className="muted small">{tpl?tpl.ente:""} · {tpl?tpl.name:""}</div>
          <h2 style={{margin:"4px 0 4px"}}>{p.code}</h2>
          <div className="muted small">Assistito: {p.assistito} · Creata {fmtDT(p.createdAt)}</div>
        </div>
        <StatusBadge st={p.status}/>
      </div>
    </div>

    {p.status==="richiesta_documenti" && <div className="infobox" style={{marginBottom:16}}>
      📋 <b>L'ufficio ti ha chiesto dei documenti.</b> {(p.statusHistory||[]).filter(h=>h.status==="richiesta_documenti").slice(-1)[0]?.note || ""}
      <div style={{marginTop:10}}>
        <label className="btn btn-t btn-sm" style={{cursor:"pointer",display:"inline-flex"}}>+ Aggiungi documenti<input type="file" multiple style={{display:"none"}} onChange={e=>{addFiles([...e.target.files]);e.target.value="";}}/></label>
      </div>
    </div>}

    <div className="grid2">
      <div className="panel pad">
        <h4 style={{marginTop:0}}>Documenti{editable?"":" caricati"}</h4>
        {editable ? <>
          <DocChecklist tpl={tpl} canEdit={true} fieldValues={p.fieldValues} toast={toast}
            getFiles={(sid)=>(p.files||[]).filter(f=>f.slotId===sid)}
            onAdd={(sid,fl)=>addBozzaFiles(sid,fl)}
            onRemove={(sid,i,fl)=>removeFile(fl.id)} />
          {reqMissing.length>0 && <div className="infobox" style={{marginTop:12}}>
            Per inviare mancano i documenti obbligatori: {reqMissing.map(d=>d.label).join(", ")}.
          </div>}
          <div style={{marginTop:14,display:"flex",justifyContent:"flex-end"}}>
            <button className="btn btn-t btn-sm" disabled={reqMissing.length>0} onClick={submitDraft}>🔒 Invia pratica</button>
          </div>
        </> : <>
          {(p.files||[]).length===0? <p className="muted">Nessun documento.</p> :
            (p.files||[]).map(f=>(
              <div className="filecard" key={f.id}>
                <div className="doc-ic uploaded">📎</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis"}}>{f.name}{f.addedAfterSubmit&&<span className="pill use" style={{marginLeft:8}}>integrazione</span>}</div>
                  <div className="muted small">{f.slotLabel} · {human(f.size)}</div>
                </div>
              </div>
            ))}
          <div className="lock-box" style={{marginTop:12}}><span>🔒</span><div>Pratica inviata: i documenti sono bloccati e non modificabili. {append?"Puoi solo aggiungerne di nuovi su richiesta dell'ufficio.":""}</div></div>
        </>}
      </div>

      <div>
        <div className="panel pad" style={{marginBottom:14}}>
          <h4 style={{marginTop:0}}>Stato pratica</h4>
          <Timeline p={p}/>
        </div>
        <div className="panel pad">
          <h4 style={{marginTop:0}}>Ricevute</h4>
          {(p.ricevute||[]).length===0? <p className="muted small" style={{marginBottom:0}}>Non ancora disponibili. Le troverai qui quando l'ufficio le caricherà.</p> :
            (p.ricevute||[]).map(r=>(
              <div className="filecard" key={r.id}>
                <div className="doc-ic" style={{background:"#e7f6ec",color:"#0a6b2e"}}>🧾</div>
                <div style={{flex:1}}><div style={{fontWeight:600}}>{r.name}</div><div className="muted small">{fmtDT(r.uploadedAt)}</div></div>
                <button className="btn btn-g btn-sm" onClick={()=>downloadBlob(r.blob,r.name)}>Scarica</button>

          <h4 style={{marginTop:0,marginBottom:8}}>💬 Chat con l'ufficio</h4>

/* ============================== STORAGE CONDIVISO (PROTOTIPO — temporaneo) ==============================
   Usa jsonbin.io (servizio JSON storage con CORS abilitato su tutti gli endpoint) per sincronizzare
   i dati demo tra dispositivi diversi (PC, cellulare) che aprono la stessa URL Netlify.

   *** CONFIGURAZIONE RICHIESTA (una tantum, gratuita, ~2 minuti) ***
   1. Vai su https://jsonbin.io e registrati gratuitamente (basta una email).
   2. Dopo il login, vai su "API Keys" nel menu account.
   3. Copia la "X-Master-Key" (inizia con qualcosa tipo "$2a$10$...").
   4. Incollala qui sotto al posto di "INSERISCI_QUI_LA_TUA_MASTER_KEY".
   5. Ricarica/ripubblica il file su Netlify.

   NOTE IMPORTANTI:
   - Questo è un meccanismo SOLO per il prototipo, in attesa dell'integrazione reale con backend Quarkus+PostgreSQL.
   - L'ID del bin condiviso viene salvato anche nell'URL (parametro ?bin=) così aprendo lo stesso link
     su un altro dispositivo si accede agli stessi dati condivisi.
   - Se l'URL non ha ?bin=, alla primissima apertura viene creato un nuovo bin con i dati demo iniziali
     e l'URL viene aggiornato automaticamente: da quel momento copia e incolla quell'URL su tutti i dispositivi.
   - La Master Key resta visibile nel codice sorgente della pagina: va bene per un prototipo interno,
     non va usata per dati realmente sensibili.
*/
const JSONBIN_MASTER_KEY = "$2a$10$cfJI6AHaldltRaxwe7T.N.r2krqGWc8HkBG8yn1JIYp70kotwUxSe";
const JSONBIN_API = "https://api.jsonbin.io/v3/b";
function getBlobIdFromUrl(){
  const p = new URLSearchParams(window.location.search);
  return p.get("bin");
}
function setBlobIdInUrl(id){
  const url = new URL(window.location.href);
  url.searchParams.set("bin", id);
  window.history.replaceState({}, "", url.toString());
}
async function createSharedBlob(initialData){
  const res = await fetch(JSONBIN_API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": JSONBIN_MASTER_KEY,
      "X-Bin-Name": "pratichub-prototipo"
    },
    body: JSON.stringify(initialData)
  });
  if(!res.ok) throw new Error("Creazione storage condiviso fallita ("+res.status+")");
  const json = await res.json();
  const id = json && json.metadata && json.metadata.id;
  if(!id) throw new Error("ID storage condiviso non ricevuto");
  return id;
}
async function loadSharedBlob(id){
  const res = await fetch(JSONBIN_API + "/" + id + "/latest", {
    headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
  });
  if(!res.ok) throw new Error("Lettura storage condiviso fallita ("+res.status+")");
  const json = await res.json();
  return json.record;
}
async function saveSharedBlob(id, data){
  const res = await fetch(JSONBIN_API + "/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": JSONBIN_MASTER_KEY
    },
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error("Salvataggio storage condiviso fallito ("+res.status+")");
}

/* ============================== APP UNIFICATA ============================== */
function App(){
  const [auth,setAuth]=useState(null);
  const [mustChange,setMustChange]=useState(false);
  const [v,setV]=useState("lista");
  const [navOpen,setNavOpen]=useState({gest:true,prat:false,area:false,altro:false});
  const [viewParams,setViewParams]=useState(null);
  const [openId,setOpenId]=useState(null);
  const [openTab,setOpenTab]=useState("scheda");
  const [collab,setCollab]=useState(COLLAB0);
  const [comms,setComms]=useState(COMMS0);
  const [pagamenti,setPagamenti]=useState(PAG0);
  const [sanzioni,setSanzioni]=useState(SANZ0);
  const [listini,setListini]=useState(LISTINI0);
  const [batches,setBatches]=useState(BATCH0);
  const [cdetData,setCdetData]=useState(()=>rebuildCompensiFromBatches({batches:[],collab:COLLAB0,listini:LISTINI0,base:CDET}));
  const [importReport,setImportReport]=useState(null);
  const [anteprima,setAnteprima]=useState(null);
  const [accontoFor,setAccontoFor]=useState(undefined);
  const [pData,setPData]=useState(seedPraticheState);
  const [toast,setToast]=useState(null);
  const flash=m=>{setToast(m);setTimeout(()=>setToast(null),2800);};

  /* ---- STORAGE CONDIVISO (prototipo) ---- */
  const [blobId,setBlobId]=useState(null);
  const [syncState,setSyncState]=useState("loading"); // loading | ready | error
  const [syncBadge,setSyncBadge]=useState(null); // null | "saving" | "saved"
  const skipNextSave = useRef(true); // evita di salvare subito dopo il caricamento iniziale
  const saveTimer = useRef(null);

  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      if(!JSONBIN_MASTER_KEY || JSONBIN_MASTER_KEY==="INSERISCI_QUI_LA_TUA_MASTER_KEY"){
        setSyncState("nokey");
        return;
      }
      try{
        let id = getBlobIdFromUrl();
        if(!id){
          const initial = { collab:COLLAB0, comms:COMMS0, pagamenti:PAG0, sanzioni:SANZ0, listini:LISTINI0, batches:BATCH0, pData:seedPraticheState() };
          id = await createSharedBlob(initial);
          setBlobIdInUrl(id);
          if(cancelled) return;
          setBlobId(id);
          setCollab(initial.collab); setComms(initial.comms); setPagamenti(initial.pagamenti);
          setSanzioni(initial.sanzioni); setListini(initial.listini); setBatches(initial.batches); setPData(initial.pData);
          setSyncState("ready");
        } else {
          const data = await loadSharedBlob(id);
          if(cancelled) return;
          setBlobId(id);
          if(data.collab) setCollab(data.collab);
          if(data.comms) setComms(data.comms);
          if(data.pagamenti) setPagamenti(data.pagamenti);
          if(data.sanzioni) setSanzioni(data.sanzioni);
          if(data.listini) setListini(data.listini);
          if(data.batches) setBatches(data.batches);
          if(data.pData) setPData(data.pData);
          setSyncState("ready");
        }
      }catch(e){
        if(cancelled) return;
        console.error(e);
        setSyncState("error");
      }
    })();
    return ()=>{cancelled=true;};
  },[]);

  /* Salvataggio automatico (debounce) ogni volta che i dati condivisi cambiano */
  useEffect(()=>{
    if(syncState!=="ready" || !blobId) return;
    if(skipNextSave.current){ skipNextSave.current=false; return; }
    setSyncBadge("saving");
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async ()=>{
      try{
        await saveSharedBlob(blobId, {collab,comms,pagamenti,sanzioni,listini,batches,pData});
        setSyncBadge("saved");
        setTimeout(()=>setSyncBadge(null),1500);
      }catch(e){
        console.error(e);
        setSyncBadge(null);
        flash("Errore di sincronizzazione — le ultime modifiche potrebbero non essere condivise");
      }
    }, 900);
  },[collab,comms,pagamenti,sanzioni,listini,batches,pData]);


  /* navigazione generica usata dai componenti del modulo Pratiche */
  const go=(name,params)=>{
    setV(name); setViewParams(params||null); setOpenId(null);
    if(["lista","comp","imp","tar","prod","cont","dash"].includes(name)) setNavOpen(o=>({...o,gest:true}));
    if(String(name).startsWith("office_")) setNavOpen(o=>({...o,prat:true}));
    if(String(name).startsWith("ac_")) setNavOpen(o=>({...o,area:true}));
    if(["scad","comm"].includes(name)) setNavOpen(o=>({...o,altro:true}));
  };

  const onTogDoc=(cid,di)=>setCollab(cs=>cs.map(c=>c.id!==cid?c:{...c,docs:c.docs.map((d,i)=>i!==di?d:{...d,vis:!d.vis})}));
  const onTogComm=id=>setComms(cs=>cs.map(c=>c.id!==id?c:{...c,vis:!c.vis}));
  const onSegnalaVar=(cid,p)=>{
    const c=collab.find(x=>x.id===cid);
    const tx=[
      'Segnalazione variazione anagrafica inviata dal collaboratore.',
      'Telefono: '+(p.tel||'—'),
      'Email: '+(p.email||'—'),
      'Indirizzo: '+(p.indirizzo||'—'),
      'IBAN: '+(p.iban||'—'),
      p.note?('Note: '+p.note):''
    ].filter(Boolean).join('\n');
    setComms(cs=>[{id:Date.now(),tt:'Variazione dati collaboratore',dt:new Date().toLocaleDateString('it-IT'),dest:'Titolare',tx,vis:false},...cs]);
    flash('Segnalazione inviata al titolare');
  };
  const onTogPortal=(cid,key)=>setCollab(cs=>cs.map(c=>c.id!==cid?c:{...c,portal:{...c.portal,[key]:!c.portal[key]}}));
  const onTogGestione=(cid,key)=>setCollab(cs=>cs.map(c=>c.id!==cid?c:{...c,gestione:{...c.gestione,[key]:!c.gestione[key]}}));
  const onSetListino=(cid,lis)=>setCollab(cs=>cs.map(c=>c.id!==cid?c:{...c,listino:lis}));
  const onUpdateCollab=(cid,patch)=>setCollab(cs=>cs.map(c=>c.id!==cid?c:{...c,...patch}));
  const onAddPag=(cid,imp,causale,data,silent)=>{
    const anno = (data||oggi()).slice(0,4);
    const amt = Number(imp||0);
    if(!(cid&&amt>0)){ if(!silent) flash("Dati pagamento non validi"); return false; }
    const guard=canRegisterAdvance({cid,anno:+anno,importo:amt,causale,pagamenti,sanzioni,detMap:cdetData});
    if(!guard.ok){ if(!silent) flash(guard.msg); return false; }
    setPagamenti(ps=>[...ps,{id:Date.now()+Math.random(),data:data||oggi(),anno:+anno,cid,importo:amt,causale}]);
    if(!silent) flash("Pagamento registrato — saldo aggiornato");
    return true;
  };
  const onTogSanz=id=>setSanzioni(ss=>ss.map(s=>s.id!==id?s:{...s,pagata:!s.pagata}));
  const onAssociaSanz=(id,cid)=>{setSanzioni(ss=>ss.map(s=>s.id!==id?s:{...s,cid}));flash("Sanzione associata");};
  const onEditTarif=(lis,anno,i,val)=>setListini(t=>({...t,[lis]:{...t[lis],[anno]:t[lis][anno].map((x,j)=>j!==i?x:val)}}));
  const onNuovoListino=base=>{
    const nome=prompt("Nome del nuovo listino (copiato da \""+base+"\"):","Listino personalizzato");
    if(nome&&!listini[nome]) setListini(t=>({...t,[nome]:JSON.parse(JSON.stringify(t[base]))}));
  };
  const onSimula=(fonte,anno,fname)=>setAnteprima({file:fname||`Export_${fonte}_${anno}.xlsx`,fonte,anno,righe:62,assoc:57,matchedByCid:{},
    unknown:[{codice:"CS76SE",righe:3,ignored:false},{codice:"RC0969",righe:2,ignored:false}],ambigui:[],strictOk:false,headerTrovato:true,sheetName:`IMPORT_${fonte}`});
  const onFileImport=async(fonte,anno,f)=>{
    if(/\.pdf$/i.test(f.name)){flash("Per la produzione serve l'export .xlsx o .csv, non PDF");return;}
    try{
      const res=await parseProduzione(f,fonte,anno,collab);
      if(res.righe===0){flash("Nessuna riga dati riconosciuta nel file — verifica il tracciato");return;}
      setAnteprima({
        file:f.name,fonte,anno,righe:res.righe,assoc:res.assoc,matchedByCid:res.matchedByCid||{},
        unknown:(res.unknown||[]).map(u=>({...u,ignored:false})),
        ambigui:(res.ambigui||[]).map(u=>({...u,ignored:false})),
        strictOk:res.strictOk,headerTrovato:res.headerTrovato,sheetName:res.sheetName,reale:true
      });
      if(!res.headerTrovato) flash("Intestazione non riconosciuta: import bloccato finché il tracciato non è coerente");
    }catch(e){flash("Errore nella lettura del file: "+(e.message||"formato non valido"));}
  };
  const onIgnoraVoce=(tipo,idx)=>setAnteprima(a=>{
    if(!a) return a;
    if(tipo==="__all__"){
      return {
        ...a,
        unknown:(a.unknown||[]).map(u=>({...u,ignored:true})),
        ambigui:(a.ambigui||[]).map(u=>({...u,ignored:true}))
      };
    }
    if(tipo==="__restore__"){
      return {
        ...a,
        unknown:(a.unknown||[]).map(u=>({...u,ignored:false})),
        ambigui:(a.ambigui||[]).map(u=>({...u,ignored:false}))
      };
    }
    const arr=[...(a[tipo]||[])];
    if(!arr[idx]) return a;
    arr[idx]={...arr[idx],ignored:!arr[idx].ignored};
    return {...a,[tipo]:arr};
  });
  const onRicalcolaImport=id=>{
    setBatches(bs=>{
      const cur=bs.find(b=>b.id===id);
      if(!cur) return bs;
      const now=new Date().toLocaleDateString("it-IT");
      return bs.map(b=>{
        if(b.id===id) return {...b,stato:"confermato",data:now};
        if(b.fonte===cur.fonte&&b.anno===cur.anno&&b.id!==id) return {...b,stato:"annullato"};
        return b;
      });
    });
    flash("Import ricalcolato e rimesso come attivo");
  };
  const onEliminaImport=id=>{
    setBatches(bs=>bs.filter(b=>b.id!==id));
    flash("Import eliminato dall'archivio");
  };
  const onConferma=annulla=>{
    if(annulla===true){setAnteprima(null);return;}
    const openUnknown=(anteprima.unknown||[]).filter(u=>!u.ignored).length;
    const openAmbigui=(anteprima.ambigui||[]).filter(u=>!u.ignored).length;
    const matchedCount=Object.keys(anteprima.matchedByCid||{}).filter(k=>{
      const v=(anteprima.matchedByCid||{})[k];
      return typeof v==="number" ? v>0 : (Number(v.metric||v.count||v.rows)||0)>0;
    }).length;
    const canConfirm=!!anteprima.headerTrovato&&anteprima.righe>0&&(openUnknown+openAmbigui)===0&&matchedCount>0;
    if(!canConfirm){flash(matchedCount===0?"Import bloccato: nessun collaboratore associato dai codici del file":"Import bloccato: risolvi o ignora prima le voci non allineate");return;}
    setBatches(bs=>[{id:Date.now(),anno:anteprima.anno,fonte:anteprima.fonte,file:anteprima.file,data:new Date().toLocaleDateString("it-IT"),righe:anteprima.righe,assoc:anteprima.assoc,matchedByCid:anteprima.matchedByCid||{},stato:"confermato"},
      ...bs.map(b=>b.fonte===anteprima.fonte&&b.anno===anteprima.anno?{...b,stato:"annullato"}:b)]);
    setAnteprima(null);
    flash("Import confermato — compensi ricalcolati");
  };
  const onGestisci=s=>{
    if(s.cid){setOpenId(s.cid);setOpenTab(s.tipo==="prod"?"compensi":"scheda");setV("lista");}
    else flash("Promemoria di gruppo: gestione dalla lista collaboratori filtrata");
  };
  const onImportAnagrafica=async(file)=>{
    try{
      const res=await parseElencoCollaboratori(file,collab);
      const nuovi=res.nuovi||[];
      setImportReport({totaleRighe:res.totaleRighe||0,aggiunti:nuovi.length,scartati:res.scarti||[],file:file.name,at:new Date().toISOString()});
      if(!nuovi.length){flash("Import completato: nessun nuovo collaboratore (vedi report)");return;}
      setCollab(cs=>[...cs,...nuovi]);
      flash(`Anagrafica aggiornata: aggiunti ${nuovi.length} collaboratori`);
    }catch(e){flash("Errore import anagrafica: "+(e.message||"file non valido"));}
  };
  const onRecalcCompensi=()=>{
    setCdetData(rebuildCompensiFromBatches({batches,collab,listini,base:CDET}));
    flash("Compensi ricalcolati dai file importati confermati");
  };
  useEffect(()=>{
    setCdetData(rebuildCompensiFromBatches({batches,collab,listini,base:CDET}));
  },[batches,collab,listini]);

  if(syncState==="nokey"){
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:"linear-gradient(150deg,var(--navy) 0%,#243660 60%,#0E5FA8 100%)",color:"#fff",fontFamily:"'Hanken Grotesk',sans-serif",padding:20}}>
      <div style={{textAlign:"center",maxWidth:520,background:"rgba(255,255,255,.08)",borderRadius:16,padding:"28px 30px"}}>
        <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:800,fontSize:22,marginBottom:14}}>Pratiche Soluzioni — Configurazione richiesta</div>
        <div style={{opacity:.95,marginBottom:10,lineHeight:1.6,textAlign:"left"}}>
          Per sincronizzare i dati tra dispositivi serve una chiave gratuita di storage:
        </div>
        <ol style={{textAlign:"left",opacity:.95,lineHeight:1.8,paddingLeft:20}}>
          <li>Vai su <b>jsonbin.io</b> e registrati gratis (basta una email)</li>
          <li>Nel menu account apri <b>API Keys</b></li>
          <li>Copia la <b>X-Master-Key</b></li>
          <li>Incollala nel file HTML al posto di <span className="mono">INSERISCI_QUI_LA_TUA_MASTER_KEY</span></li>
          <li>Ripubblica il file su Netlify</li>
        </ol>
      </div>
    </div>;
  }
  if(syncState==="loading"){
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:"linear-gradient(150deg,var(--navy) 0%,#243660 60%,#0E5FA8 100%)",color:"#fff",fontFamily:"'Hanken Grotesk',sans-serif"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:800,fontSize:22,marginBottom:10}}>Pratiche Soluzioni</div>
        <div style={{opacity:.85}}>Sincronizzazione dati in corso…</div>
      </div>
    </div>;
  }
  if(syncState==="error"){
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:"linear-gradient(150deg,var(--navy) 0%,#243660 60%,#0E5FA8 100%)",color:"#fff",fontFamily:"'Hanken Grotesk',sans-serif",padding:20}}>
      <div style={{textAlign:"center",maxWidth:420}}>
        <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:800,fontSize:22,marginBottom:10}}>Pratiche Soluzioni</div>
        <div style={{opacity:.9,marginBottom:16}}>Impossibile connettersi allo storage condiviso del prototipo. Verifica la connessione e ricarica la pagina.</div>
        <button className="btn btn-sky" onClick={()=>window.location.reload()}>Riprova</button>
      </div>
    </div>;
  }

  if(!auth) return <Login onLogin={a=>{setAuth(a);setMustChange(!!a.mustChange);setV(a.role==="titolare"?"lista":"chome");setOpenId(null);}}/>;
  if(mustChange) return <ChangePassword onDone={()=>setMustChange(false)}/>;

  const me=auth.role==="collab"?collab.find(c=>c.id===auth.cid):null;
  const meId=auth.role==="titolare"?"u_office":me.id;
  const meName=auth.role==="titolare"?"Cosimo Spanò":me.nome;

  /* ---- costruzione voci di navigazione ---- */
  const NAV_T_GESTIONE=[["lista","👥","Collaboratori"],["comp","💶","Compensi"],["imp","📥","Import"],["tar","🏷","Tariffari"],["prod","📊","Produzione"],["cont","🧾","Pagam./Sanzioni"]];
  const NAV_T_PRATICHE=[["office_pratiche","📁","Pratiche"],["office_templates","🧩","Tipi di pratica"],["office_impdocs","📌","Documenti importanti"]];
  const NAV_T_AREA_CLIENTI=[["ac_clienti","👥","Clienti"],["ac_caricamenti","📤","Caricamenti"],["ac_documenti","📄","Documenti"],["ac_chat","💬","Chat"],["ac_news","📰","News"],["ac_comunicazioni","✉","Comunicazioni"],["ac_richieste","📋","Richieste"],["ac_categorie","🗂","Categorie"]];
  const NAV_T_ALTRO=[["scad","⏰","Scadenze"],["comm","✉","Comunicazioni"]];

  let NAV_C_CONTABILITA=[];
  let NAV_C_INVIO=[];
  if(me){
    if(me.portal.dashboard) NAV_C_CONTABILITA.push(["chome","🏠","Dashboard"]);
    if(me.portal.compensi) NAV_C_CONTABILITA.push(["ccomp","💶","Compensi"]);
    GESTIONE_KEYS.forEach(([k,ic,label])=>{ if(me.gestione[k]) NAV_C_CONTABILITA.push([k,ic,label]); });
    if(me.portal.documenti) NAV_C_CONTABILITA.push(["collab_impdocs","📌","Doc. importanti"]);
    if(me.portal.comunicazioni) NAV_C_CONTABILITA.push(["ccomm","✉","Comunicazioni"]);

    if(me.portal.mie_pratiche) NAV_C_INVIO.push(["collab_pratiche","📁","Le mie pratiche"]);
    if(me.portal.nuova_pratica) NAV_C_INVIO.push(["collab_new","➕","Nuova pratica"]);
    if(me.portal.impdocs && !me.portal.documenti) NAV_C_INVIO.push(["collab_impdocs","📌","Doc. importanti"]);
  }

  const urgent=SCAD.filter(s=>s.urgent).length;
  const openC=openId?collab.find(c=>c.id===openId):null;

  /* ---- contenuto principale ---- */
  function renderTitolare(){
    if(openC) return <DettaglioCollab c={openC} onBack={()=>{setOpenId(null);setV("lista");}} onDelete={onDeleteCollab} onTogDoc={onTogDoc} onTogPortal={onTogPortal}
        onTogGestione={onTogGestione} onSetListino={onSetListino} onUpdate={onUpdateCollab} listini={listini} pagamenti={pagamenti} sanzioni={sanzioni}
        onAcconto={cid=>setAccontoFor(cid)} tabInit={openTab} toast={flash} detMap={cdetData} key={openId+openTab}/>;
    switch(v){
      case "lista": return <Lista collab={collab} onOpen={id=>{setOpenTab("scheda");setOpenId(id);}} onImportAnagrafica={onImportAnagrafica} importReport={importReport}/>;
      case "comp": return <CompensiView collab={collab} pagamenti={pagamenti} sanzioni={sanzioni} onAcconto={cid=>setAccontoFor(cid)} detMap={cdetData} onRecalc={onRecalcCompensi} listini={listini}/>;
      case "imp": return <ImportView batches={batches} onSimula={onSimula} onFileImport={onFileImport} anteprima={anteprima} onConferma={onConferma} onIgnoraVoce={onIgnoraVoce} onRicalcolaImport={onRicalcolaImport} onEliminaImport={onEliminaImport} toast={toast}/>;
      case "tar": return <TariffarioView listini={listini} collab={collab} onEdit={onEditTarif} onNuovo={onNuovoListino}/>;
      case "prod": return <Produzione collab={collab}/>;
      case "cont": return <ContabilitaView collab={collab} pagamenti={pagamenti} sanzioni={sanzioni} onAddPag={onAddPag} onTogSanz={onTogSanz} onAssociaSanz={onAssociaSanz} onOpenAcconto={cid=>setAccontoFor(cid)} flash={flash}/>;
      case "scad": return <Scadenze onGestisci={onGestisci}/>;
      case "comm": return <Comunicazioni collab={collab} comms={comms} onTogComm={onTogComm}/>;
      case "office_pratiche": return <OfficePratiche pData={pData} setPData={setPData} collab={collab} go={go} me={{role:"titolare"}}/>;
      case "office_detail": return <OfficeDetail pData={pData} setPData={setPData} collab={collab} go={go} toast={flash} id={viewParams?.id} meId={meId}/>;
      case "office_templates": return <OfficeTemplates pData={pData} setPData={setPData} go={go} toast={flash}/>;
      case "office_template_edit": return <TemplateEditor pData={pData} setPData={setPData} go={go} toast={flash} id={viewParams?.id}/>;
      case "office_impdocs": return <ImpDocsOffice pData={pData} setPData={setPData} collab={collab} toast={flash}/>;
      case "ac_clienti":
      case "ac_caricamenti":
      case "ac_documenti":
      case "ac_chat":
      case "ac_news":
      case "ac_comunicazioni":
      case "ac_richieste":
      case "ac_categorie":
        return typeof AreaClientiShell==="function"?<AreaClientiShell view={v} go={go}/>:<div className="panel"><h2>Area clienti</h2><p className="muted">Rigenera il frontend con build_unificato per attivare il modulo.</p></div>;
      default: return <Lista collab={collab} onOpen={id=>{setOpenTab("scheda");setOpenId(id);}} onImportAnagrafica={onImportAnagrafica} importReport={importReport}/>;
    }
  }
  function renderCollab(){
    if(v==="ccomp") return <PayCompensiTab nome={me.nome} collabId={me.id} toast={flash} readOnlyCollab hideListino />;
    if(["chome","cdocs","ccomm","ccod"].includes(v))
      return <PortaleCollab me={me} comms={comms} pagamenti={pagamenti} sanzioni={sanzioni} view={v} detMap={cdetData} onSegnalaVar={onSegnalaVar}/>;
    if(v==="collab_pratiche") return <CollabPratiche pData={pData} me={me} go={go}/>;
    if(v==="collab_new") return <CollabNew pData={pData} setPData={setPData} me={me} go={go} toast={flash}/>;
    if(v==="collab_detail") return <CollabDetail pData={pData} setPData={setPData} me={me} go={go} toast={flash} id={viewParams?.id}/>;
    if(v==="collab_impdocs") return <ImpDocsCollab pData={pData} me={me}/>;
    if(GESTIONE_KEYS.some(([k])=>k===v))
      return <GestioneFiltrata view={v} me={me} collab={collab} pagamenti={pagamenti} sanzioni={sanzioni} batches={batches} listini={listini}
        onAddPag={onAddPag} onTogSanz={onTogSanz} onAssociaSanz={onAssociaSanz} onOpenAcconto={cid=>setAccontoFor(cid)} flash={flash}
        onSimula={onSimula} onFileImport={onFileImport} anteprima={anteprima} onConferma={onConferma} onIgnoraVoce={onIgnoraVoce} onRicalcolaImport={onRicalcolaImport} onEliminaImport={onEliminaImport} toast={toast}
        onEditTarif={onEditTarif} onNuovo={onNuovoListino} detMap={cdetData} onRecalcCompensi={onRecalcCompensi}/>;
    return <PortaleCollab me={me} comms={comms} pagamenti={pagamenti} sanzioni={sanzioni} view="chome" detMap={cdetData} onSegnalaVar={onSegnalaVar}/>;
  }

  const flatNav = auth.role==="titolare"
    ? [...NAV_T_GESTIONE,...NAV_T_PRATICHE,...NAV_T_AREA_CLIENTI,...NAV_T_ALTRO]
    : [...NAV_C_CONTABILITA,...NAV_C_INVIO];

  const isAreaView = /^ac_/.test(v);

  return <div className="app">
    <aside className="side">
      <div className="logo">
        <img src={LOGO_FULL} alt="Pratiche Soluzioni" onError={e=>{e.currentTarget.style.display='none'; const f=e.currentTarget.nextElementSibling; if(f) f.style.display='inline';}}/>
        <span className="fallback">Pratiche <b>Soluzioni</b></span>
      </div>
      {syncBadge && <div className="side-sync">
        <span style={{width:7,height:7,borderRadius:"50%",background:syncBadge==="saving"?"#FFC107":"#75CEF3",display:"inline-block"}}/>
        {syncBadge==="saving"?"Salvataggio…":"Sincronizzato"}
      </div>}

      {auth.role==="titolare" && <>
        <NavSection id="gest" label="Collaboratori & compensi" items={NAV_T_GESTIONE} v={v} openC={openC} go={go} navOpen={navOpen} setNavOpen={setNavOpen}/>
        <NavSection id="prat" label="Pratiche" items={NAV_T_PRATICHE} v={v} openC={openC} go={go} navOpen={navOpen} setNavOpen={setNavOpen}/>
        <NavSection id="area" label="Area clienti" items={NAV_T_AREA_CLIENTI} v={v} openC={openC} go={go} navOpen={navOpen} setNavOpen={setNavOpen}/>
        <NavSection id="altro" label="Altro" items={NAV_T_ALTRO} v={v} openC={openC} go={go} navOpen={navOpen} setNavOpen={setNavOpen}
          extra={k=>k==="scad"&&urgent>0?<span className="bdg">{urgent}</span>:null}/>
      </>}
      {auth.role==="collab" && <>
        {NAV_C_CONTABILITA.length>0 && <div className="navlabel">Contabilità</div>}
        {NAV_C_CONTABILITA.map(([k,i,l])=>
          <button key={k} className={"nav-it"+(v===k?" on":"")} onClick={()=>go(k)}><span className="ic">{i}</span>{l}</button>)}
        <div className="navlabel">Invio pratiche</div>
        {NAV_C_INVIO.map(([k,i,l])=>
          <button key={k} className={"nav-it"+(v===k?" on":"")} onClick={()=>go(k)}><span className="ic">{i}</span>{l}</button>)}
      </>}

      <div style={{marginTop:"auto",paddingTop:16,borderTop:"1px solid rgba(255,255,255,.12)"}}>
        <div className="who">
          <b>{meName}</b>
          <span>{auth.role==="titolare"?"Titolare":"Collaboratore"}</span>
        </div>
        <button className="out" onClick={()=>{setAuth(null);setV("lista");setOpenId(null);}}>→ Esci</button>
      </div>
    </aside>
    {isAreaView ? (
      <div className="main area-main">
        {renderTitolare()}
      </div>
    ) : (
      <main className="main">
        {auth.role==="titolare" ? renderTitolare() : renderCollab()}
        {toast && v!=="imp" && <div className="toast">{toast}</div>}
        {accontoFor!==undefined && <AccontoModal collab={collab} cid={accontoFor} onClose={()=>setAccontoFor(undefined)} onSave={(c,i,ca,da)=>onAddPag(c,i,ca,da)}/>}
      </main>
    )}
    <nav className="bnav">
      {flatNav.map(([k,i,l])=><button key={k} className={v===k?"on":""} onClick={()=>go(k)}><span className="i">{i}</span>{l}</button>)}
    </nav>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
