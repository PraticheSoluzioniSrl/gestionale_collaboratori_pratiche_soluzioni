<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraticHub — Gestionale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --navy:#0A2A6C; --navy2:#1B2A4E; --sky:#42A8F0; --teal:#10B4A2;
  --bg:#F2F6FB; --ink:#152238; --mut:#5A6B85; --line:#E2EAF4;
  --amber:#B97A00; --amberbg:#FFF4D6; --red:#C2403A; --redbg:#FDE8E7; --tealbg:#E0F7F4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Hanken Grotesk',sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::placeholder{color:#93A4BC}

/* LOGIN */
.lwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--navy) 0%,#123A8C 60%,#0E5FA8 100%);padding:20px}
.lcard{background:#fff;border-radius:20px;padding:36px 34px;width:min(440px,100%);box-shadow:0 24px 70px rgba(4,16,44,.45)}
.lcard .logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;letter-spacing:-.5px;display:flex;align-items:center;gap:9px;margin-bottom:6px}
.lcard .logo b{color:var(--sky)}
.lcard .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--teal)}
.lcard .sub{color:var(--mut);font-size:13.5px;margin-bottom:24px}
.lfld{margin-bottom:14px}
.lfld label{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:6px}
.lfld input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;outline:none}
.lfld input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(66,168,240,.15)}
.lerr{background:var(--redbg);color:var(--red);font-size:13px;font-weight:600;border-radius:10px;padding:10px 13px;margin-bottom:14px}
.lbtn{width:100%;background:var(--navy);color:#fff;font-weight:700;font-size:15px;border-radius:11px;padding:14px}
.lbtn:hover{background:#0D3585}
.ldemo{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--mut);line-height:1.7}
.ldemo b{color:var(--ink)}
.ldemo .mono{background:#F0F5FC;border-radius:5px;padding:1px 6px;font-size:11.5px}
.lpick{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.15s}
.lpick:hover{border-color:var(--sky);background:#F7FAFE}
.lpick .av{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Bricolage Grotesque';font-size:14px;flex-shrink:0}
.lpick .nm{font-weight:700;font-size:14px}
.lpick .rl{font-size:12px;color:var(--mut)}
.lpick .go{color:var(--sky);font-weight:700;margin-left:auto}

/* APP */
.app{display:flex;min-height:100vh}
.side{width:240px;background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:21px;letter-spacing:-.5px;padding:0 10px 16px;display:flex;align-items:center;gap:8px}
.logo b{color:var(--sky)}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.navlabel{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#7d93c4;padding:14px 12px 6px}
.navlabel:first-of-type{padding-top:4px}
.nav-it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#C7D6F2;font-weight:600;font-size:14px;width:100%;text-align:left}
.nav-it:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-it.on{background:var(--sky);color:#fff}
.nav-it .ic{width:20px;text-align:center;font-size:15px}
.nav-it .bdg{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 7px}
.nav-it .lock{margin-left:auto;font-size:10px;opacity:.7}
.side .who{margin-top:auto;padding:12px 10px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:#A8BCE5;line-height:1.5}
.side .who b{color:#fff;display:block}
.side .out{color:#FCA9A4;font-weight:700;font-size:12.5px;padding:6px 0;text-align:left}

.main{flex:1;min-width:0;padding:26px 30px 100px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sub{color:var(--mut);font-size:13.5px;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:#0D3585}
.btn-t{background:var(--teal);color:#fff}.btn-t:hover{filter:brightness(1.06)}
.btn-g{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn-g:hover{border-color:var(--sky)}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{filter:brightness(1.06)}
.btn-sky{background:var(--sky);color:#fff}.btn-sky:hover{filter:brightness(1.06)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lockpill{font-size:11px;font-weight:700;background:var(--navy2);color:#fff;border-radius:99px;padding:4px 11px}

.searchwrap{position:relative;margin-bottom:14px}
.search{width:100%;padding:14px 16px 14px 46px;border:1.5px solid var(--line);border-radius:13px;background:#fff;font-size:15px;outline:none}
.search:focus{border-color:var(--sky)}
.searchwrap .lens{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#93A4BC;font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cnt{font-size:13px;color:var(--mut);margin-bottom:10px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:flex-start}
.card:hover{border-color:var(--sky);box-shadow:0 4px 14px rgba(10,42,108,.07)}
.ava{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--sky),var(--teal));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Bricolage Grotesque';font-size:15px;flex-shrink:0}
.card .bd{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .loc{font-size:12.5px;color:var(--mut);margin-top:2px}
.codes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.code{display:inline-flex;align-items:center;gap:5px;background:#F0F5FC;border:1px solid #DCE7F5;border-radius:7px;padding:3px 8px}
.code .k{font-weight:700;color:var(--mut);font-size:10px;letter-spacing:.4px}
.code .v{font-family:'JetBrains Mono';font-weight:600;color:var(--navy);font-size:11.5px}
.code.open{background:var(--redbg);border-color:#F2C4C2}.code.open .v{color:var(--red)}
.code.warn{background:var(--amberbg);border-color:#F0DCA0}.code.warn .v{color:var(--amber)}
.st{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px}
.st-ok{background:var(--tealbg);color:#0A7E72}
.st-open{background:var(--redbg);color:var(--red)}
.st-warn{background:var(--amberbg);color:var(--amber)}
.note-flag{font-size:12px;color:var(--amber);font-weight:600;margin-top:7px}
.riskmini{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:7px;padding:4px 9px;margin-top:6px}
.r-hi{background:var(--redbg);color:var(--red)}
.r-md{background:var(--amberbg);color:var(--amber)}
.r-ok{background:var(--tealbg);color:#0A7E72}
.boll{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:7px;padding:4px 9px;margin-top:6px}
.boll.paid{background:var(--tealbg);color:#0A7E72}
.boll.due{background:var(--redbg);color:var(--red)}
.card .meta{text-align:right;flex-shrink:0;font-size:12px;color:var(--mut)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.kpi .kv{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px}
.kpi .kl{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.kpi.alert .kv{color:var(--red)}
.kpi.good .kv{color:var(--teal)}
.kpi.navy .kv{color:var(--navy)}

.panel{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:16px;overflow:hidden}
.panel .ph{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .ph h3{font-size:15px;font-weight:700}
.panel .ph .sp{margin-left:auto;display:flex;gap:8px}
.panel .pad{padding:18px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);text-align:right;padding:9px 14px;border-bottom:1px solid var(--line);background:#F8FAFD}
.tbl th:first-child{text-align:left}
.tbl td{padding:9px 14px;border-bottom:1px solid #EFF4FA;text-align:right;font-variant-numeric:tabular-nums}
.tbl td:first-child{text-align:left;font-weight:600}
.tbl tr.cat td{background:#F0F5FC;font-weight:800;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--navy);text-align:left}
.tbl tr.tot td{font-weight:800;background:#F8FAFD;border-top:2px solid var(--line)}
.tbl .e{color:var(--mut)}
.tbl .neg{color:var(--red);font-weight:700}
.tbl tr.clk:hover{background:#F7FAFE;cursor:pointer}
.selrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.selrow select{border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;background:#fff;font-weight:600;min-width:150px}

.saldo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sbox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.sbox .l{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.sbox .v{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;margin-top:3px}
.sbox.final{background:var(--navy);border-color:var(--navy)}
.sbox.final .l{color:#A8BCE5}
.sbox.final .v{color:#fff}
.sbox .v.neg{color:var(--red)}

/* import / banca */
.dz{border:2px dashed #B9CFEA;border-radius:15px;background:#fff;padding:34px 20px;text-align:center;color:var(--mut);margin-bottom:16px;cursor:pointer;transition:.15s}
.dz.over{border-color:var(--sky);background:#EAF3FD;transform:scale(1.005)}
.dz .big{font-size:32px;margin-bottom:8px}
.batch{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.batch .fi{width:36px;height:36px;border-radius:9px;background:#EAF3FD;display:flex;align-items:center;justify-content:center;font-size:16px}
.batch .bn{font-weight:700;font-size:13.5px}
.batch .bm{font-size:12px;color:var(--mut)}
.bst{font-size:10.5px;font-weight:700;border-radius:99px;padding:3px 10px;margin-left:auto}
.bst.ok{background:var(--tealbg);color:#0A7E72}
.bst.prev{background:var(--amberbg);color:var(--amber)}
.bst.ann{background:#EDF1F7;color:var(--mut)}
.unk{background:var(--amberbg);border:1px solid #F0DCA0;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.unk .ut{font-weight:700;font-size:13.5px;color:#6B4A00;margin-bottom:9px}
.unkrow{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.unkrow .mono{background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.unkrow select{border:1.5px solid #E5D193;border-radius:8px;padding:6px 9px;background:#fff;font-size:12.5px}
.bkrow{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:7px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:13px}
.bkrow.matched{border-left:4px solid var(--teal)}
.bkrow.um{border-left:4px solid #E0B100;background:#FFFDF4}
.bkrow .d{font-weight:700;font-family:'JetBrains Mono';font-size:12px}
.bkrow .descr{flex:1;min-width:170px;color:var(--mut)}
.bkrow .imp{font-weight:800;font-family:'Bricolage Grotesque'}
.bkrow select{border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;font-size:12.5px}
.bkmatch{font-size:11.5px;font-weight:700;color:#0A7E72;background:var(--tealbg);border-radius:99px;padding:3px 10px}

/* dettaglio collaboratore — pagina intera */
.dpage-h{background:var(--navy);color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:18px;position:relative}
.dpage-h h2{font-size:22px;font-weight:700;padding-right:40px}
.dpage-h .as{font-size:13px;color:#A8BCE5;margin-top:5px}
.dpage-h .back{position:absolute;top:18px;right:18px;color:#B9C9E8;font-weight:700;font-size:13px;background:rgba(255,255,255,.1);border-radius:9px;padding:8px 14px}
.dpage-h .back:hover{background:rgba(255,255,255,.2);color:#fff}
.dtabs{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}
.dtabs button{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:700;color:#A8BCE5}
.dtabs button.on{background:rgba(255,255,255,.18);color:#fff}
.sec{margin-bottom:24px}
.sec h3{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3:after{content:'';flex:1;height:1px;background:var(--line)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.cbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cbox .k{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--mut)}
.cbox .v{font-family:'JetBrains Mono';font-weight:600;font-size:14px;color:var(--navy);margin-top:3px}
.cbox.open{background:var(--redbg)}.cbox.open .v{color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #EFF4FA;font-size:14px;gap:10px;background:transparent}
.row:last-child{border-bottom:none}
.row .l{color:var(--mut);font-size:12.5px;flex-shrink:0}
.row .r{font-weight:600;text-align:right;word-break:break-word}
.bolrow{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:7px}
.bolrow .y{font-family:'Bricolage Grotesque';font-weight:700;font-size:15px}
.docrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:#fff}
.docrow.hidden-doc{background:#F7F9FC;border-style:dashed}
.docrow .fi{width:34px;height:34px;border-radius:8px;background:#EAF3FD;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.docrow .dn{font-weight:600;font-size:13.5px}
.docrow .dm{font-size:11.5px;color:var(--mut)}
.notebox{background:var(--amberbg);border:1px solid #F0DCA0;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#6B4A00;font-weight:500;margin-bottom:16px}
.infobox{background:#F0F5FC;border:1px solid #DCE7F5;border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--navy);font-weight:500;margin-bottom:16px}
.dlink{margin-left:auto;color:var(--sky);font-weight:700;font-size:12.5px}
.vtog{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:99px;padding:4px 10px;margin-left:auto;flex-shrink:0;border:1.5px solid transparent}
.vtog.vis{background:var(--tealbg);color:#0A7E72}
.vtog.hid{background:#EDF1F7;color:var(--mut);border-color:var(--line)}
.cred{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;margin-bottom:12px}
.swrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:9px}
.swrow .t{flex:1}
.swrow .t b{display:block;font-size:14px}
.swrow .t span{font-size:12px;color:var(--mut)}
.sw{width:46px;height:26px;border-radius:99px;background:#D5DEEC;position:relative;flex-shrink:0;transition:.18s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--teal)}
.sw.on:after{left:23px}
.permgroup{margin-bottom:18px}
.permgroup .pgt{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-bottom:8px}

/* pagamenti/sanzioni */
.tabs2{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs2 button{padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--mut);background:#fff;border:1.5px solid var(--line)}
.tabs2 button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.formrow{display:flex;gap:9px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:16px;align-items:flex-end}
.formrow .f{flex:1;min-width:120px}
.formrow label{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:5px}
.formrow input,.formrow select,.formrow textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;background:#FBFDFF}
.spill{font-size:10.5px;font-weight:700;border-radius:99px;padding:3px 10px}
.spill.no{background:var(--redbg);color:var(--red)}
.spill.si{background:var(--tealbg);color:#0A7E72}

/* scadenze */
.due-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:9px;display:flex;gap:13px;align-items:center}
.due-card .dt{width:52px;text-align:center;flex-shrink:0;background:#F0F5FC;border-radius:10px;padding:7px 4px}
.due-card .dt .d{font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;color:var(--navy);line-height:1}
.due-card .dt .m{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--mut);text-transform:uppercase;margin-top:2px}
.due-card.urgent .dt{background:var(--redbg)}.due-card.urgent .dt .d{color:var(--red)}
.due-card .bd{flex:1;min-width:0}
.due-card .tt{font-weight:700;font-size:14.5px}
.due-card .ss{font-size:12.5px;color:var(--mut);margin-top:2px}
.tpill{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px}
.tp-bol{background:#EAF3FD;color:var(--navy)}
.tp-del{background:#F1E8FB;color:#6B3FA0}
.tp-adm{background:var(--tealbg);color:#0A7E72}
.tp-prod{background:var(--redbg);color:var(--red)}

/* comunicazioni */
.comp{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:22px}
.comp label{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:7px}
.comp select,.comp textarea,.comp input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;background:#FBFDFF}
.comp textarea{min-height:80px;resize:vertical}
.fld{margin-bottom:14px}
.dest-prev{background:#F0F5FC;border-radius:10px;padding:10px 13px;font-size:13px;color:var(--navy);font-weight:600;margin-bottom:14px}
.hist{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 17px;margin-bottom:9px}
.hist .hh{display:flex;align-items:flex-start;gap:10px}
.hist .ht{font-weight:700;font-size:14px}
.hist .hm{font-size:12.5px;color:var(--mut);margin-top:3px}
.hist .hd{font-size:13.5px;margin-top:7px;color:#33415C}

/* spark / produzione */
.spark{display:flex;align-items:flex-end;gap:4px;height:46px;min-width:120px}
.spark .b{width:14px;border-radius:4px 4px 2px 2px;background:#CBDDF3;position:relative}
.spark .b.last{background:var(--sky)}
.spark .b.bad{background:#F0B6B3}
.spark .b.bad.last{background:var(--red)}
.spark .b span{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:var(--mut)}
.prod-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prod-card.hi{border-left:4px solid var(--red)}
.prod-card.md{border-left:4px solid #E0B100}
.prod-card.ok{border-left:4px solid var(--teal)}
.prod-card .who{flex:1;min-width:170px}
.prod-card .who .n{font-weight:700;font-size:15px}
.prod-card .who .c{font-size:12px;color:var(--mut);margin-top:2px}
.pstats{display:flex;gap:18px;flex-wrap:wrap}
.pstat{text-align:right;min-width:74px}
.pstat .v{font-family:'Bricolage Grotesque';font-weight:800;font-size:17px}
.pstat .v.neg{color:var(--red)}.pstat .v.pos{color:var(--teal)}
.pstat .l{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase}
.payrow{font-size:12px;font-weight:600;margin-top:4px}
.payrow.late{color:var(--red)}.payrow.okp{color:#0A7E72}

/* portale collaboratore */
.cport-h{background:linear-gradient(135deg,var(--navy),#123A8C);border-radius:16px;color:#fff;padding:22px 24px;margin-bottom:20px}
.cport-h h2{font-size:20px;font-weight:700}
.cport-h .s{color:#A8BCE5;font-size:13px;margin-top:4px}
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast-wrap .toast{position:static;transform:none;left:auto;bottom:auto}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy2);color:#fff;font-size:13.5px;font-weight:600;border-radius:12px;padding:12px 20px;z-index:99;box-shadow:0 10px 30px rgba(4,16,44,.4);display:flex;align-items:center;gap:10px;min-width:200px}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
.empty .big{font-size:38px;margin-bottom:10px}

/* modale */
.movl{position:fixed;inset:0;background:rgba(10,26,56,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-bg{position:fixed;inset:0;background:rgba(10,26,56,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;padding:0;width:min(460px,100%);box-shadow:0 24px 70px rgba(4,16,44,.4);max-height:88vh;overflow:auto}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:17px;font-weight:700}
.modal-h .x{font-size:22px;color:var(--mut);line-height:1;padding:2px 6px;border-radius:8px}
.modal-h .x:hover{background:#F0F5FC;color:var(--ink)}
.modal .mf{margin-bottom:13px}
.modal label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:5px}
.modal input,.modal select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#FBFDFF}

/* ===== modulo pratiche — elementi specifici ===== */
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.badge-st{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:700}
.dotst{width:7px;height:7px;border-radius:50%}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.pill.req{background:var(--redbg);color:var(--red)}
.pill.use{background:var(--amberbg);color:var(--amber)}
.pill.opt{background:#eef2fa;color:var(--mut)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{padding:12px 16px;border-bottom:3px solid transparent;font-weight:700;font-size:13.5px;color:var(--mut)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--sky)}
.filecard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:8px}
.doc-ic{width:38px;height:38px;border-radius:10px;background:#F0F5FC;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.doc-ic.uploaded{background:#EAF3FD}
.hashtag{font-family:'JetBrains Mono';font-size:10.5px;color:var(--mut);background:#F0F5FC;border-radius:6px;padding:2px 7px}
.lock-box{display:flex;align-items:flex-start;gap:10px;background:#F0F5FC;border:1px solid #DCE7F5;border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--mut)}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.timeline-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;position:relative}
.timeline-row .tdot{width:10px;height:10px;border-radius:50%;background:var(--sky);margin-top:4px;flex-shrink:0;position:relative;z-index:1}
.timeline-row .tline{position:absolute;left:4px;top:14px;bottom:-14px;width:2px;background:var(--line)}
.timeline-row:last-child .tline{display:none}
.timeline-row .tt{font-weight:700;font-size:13.5px}
.timeline-row .ts{font-size:11.5px;color:var(--mut);margin-top:2px}
.timeline-row .tn{font-size:12.5px;color:#6B4A00;background:var(--amberbg);border-radius:8px;padding:6px 9px;margin-top:5px}
.chatbox{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.chatmsg{max-width:84%;padding:9px 12px;border-radius:12px;font-size:13px}
.chatmsg.me{align-self:flex-end;background:var(--navy);color:#fff}
.chatmsg.them{align-self:flex-start;background:#F0F5FC;color:var(--ink)}
.chatmsg .cm-meta{font-size:10.5px;opacity:.7;margin-top:3px}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.upload-slot{border:1.5px dashed var(--line);border-radius:11px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:11px;background:#FAFCFF}
.upload-slot.filled{border-style:solid;border-color:var(--teal);background:#fff}
.upload-slot.locked{background:#F7F9FC;border-color:var(--line)}
.field-row{margin-bottom:13px}
.field-row label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px}
.stepper{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.stepper .stp{flex:1;min-width:90px;text-align:center;padding:10px 8px;border-radius:10px;font-size:12px;font-weight:700;background:#F0F5FC;color:var(--mut)}
.stepper .stp.on{background:var(--navy);color:#fff}
.stepper .stp.done{background:var(--tealbg);color:#0A7E72}
.tplist-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:9px;cursor:pointer}
.tplist-row:hover{border-color:var(--sky)}
.tplist-row .ti{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--sky),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Bricolage Grotesque'}
.bnav{display:none}
@media(max-width:920px){
  .side{display:none}
  .main{padding:18px 14px 96px}
  .card .meta{display:none}
  .tbl{font-size:12px}
  .tbl th,.tbl td{padding:7px 8px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);z-index:30;padding:8px 4px calc(8px + env(safe-area-inset-bottom));overflow-x:auto}
  .bnav button{flex:1;min-width:64px;color:#9FB4DD;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px}
  .bnav button .i{font-size:18px}
  .bnav button.on{color:#fff;background:rgba(66,168,240,.25)}
}
</style>

function rowCalc(r){
  const [cat,voce,qty,tar,tipo,val,base]=r;
  const imp = base!=null ? base : (tar?qty*tar:0);
  const comp = tipo==="fisso" ? qty*val : imp*val;
  return {cat,voce,qty,tar,tipo,val,imp,comp};
}
function saldoData(cid,anno,pagamenti,sanzioni){
  const det=CDET[cid];
  if(!det) return null;
  const rows=det.rows.map(rowCalc);
  const maturato=rows.reduce((a,r)=>a+r.comp,0);
  const sz=sanzioni.filter(s=>s.cid===cid&&s.anno===anno&&!s.pagata).reduce((a,s)=>a+s.importo,0);
  const acc=pagamenti.filter(p=>p.cid===cid&&p.anno===anno).reduce((a,p)=>a+p.importo,0);
  return {rows,maturato,sz,acc,riporto:det.riporto,saldo:det.riporto+maturato-sz-acc};
}

async function sha256(blob){
  try{
    const buf = await blob.arrayBuffer();
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return Math.random().toString(16).slice(2)+Date.now().toString(16); }
}

const human = (bytes)=>{ if(!bytes)return "—"; const u=["B","KB","MB","GB"]; let i=0,n=bytes; while(n>=1024&&i<3){n/=1024;i++;} return n.toFixed(n<10&&i>0?1:0)+" "+u[i]; };
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const normS=s=>String(s==null?"":s).trim().toUpperCase();

async function readRows(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{header:1,defval:""});

/* --- Produzione: rileva header, colonna codice, conta righe e codici --- */
const FONTE_CODEKEYS={CAF:["caf","gest"],PATRONATO:["caf","gest","del","naspi","misia"],MENSILITA:["misia"],NASPI:["naspi"],DS_AGRICOLE:["naspi"],STIPENDI:[]};
const HDR_CODE=["OPERATORE","CODICE","SEDE","STRUTTURA","ZONA","COD."];
async function parseProduzione(file,fonte,collab){
  const rows=await readRows(file);
  let hRow=-1, codeCol=0;
  for(let i=0;i<Math.min(rows.length,15)&&hRow<0;i++){
    const r=rows[i].map(normS);
    for(let j=0;j<r.length;j++){
      if(HDR_CODE.some(h=>r[j]===h||r[j].startsWith(h))){hRow=i;codeCol=j;break;}
    }
  }
  const start=hRow>=0?hRow+1:0;
  const counts={};
  let righe=0;
  for(let i=start;i<rows.length;i++){
    const code=normS(rows[i][codeCol]);
    if(!code||/TOTALE|TOTAL/.test(code))continue;
    if(hRow<0&&i===0)continue; // salta eventuale intestazione non riconosciuta
    righe++; counts[code]=(counts[code]||0)+1;
  }
  const keys=FONTE_CODEKEYS[fonte]&&FONTE_CODEKEYS[fonte].length?FONTE_CODEKEYS[fonte]:["caf","gest","del","naspi","misia"];
  const known=new Set();
  collab.forEach(c=>keys.forEach(k=>{const v=normS(c.codici[k]).replace("*","");if(v)known.add(v);}));
  const unknown=Object.keys(counts).filter(c=>!known.has(c)).map(c=>({codice:c,righe:counts[c],assegnato:null}));
  const assoc=righe-unknown.reduce((a,u)=>a+u.righe,0);
  return {righe,assoc,unknown,headerTrovato:hRow>=0};
}

/* --- Estratto conto: CSV/XLSX con rilevamento colonne, PDF con estrazione testo --- */
const parseItNum=s=>{
  if(typeof s==="number")return s;
  const t=String(s).replace(/\./g,"").replace(",",".").replace(/[^\d.\-]/g,"");
  const v=parseFloat(t);return isNaN(v)?null:v;
};
const serialToISO=n=>new Date(Math.round((n-25569)*86400*1000)).toISOString().slice(0,10);
const itToISO=s=>{
  const m=String(s).match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);
  if(!m)return null;
  const y=m[3].length===2?"20"+m[3]:m[3];
  return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
};
async function parseBancaTabella(file){
  const rows=await readRows(file);
  let h=-1,dCol=-1,xCol=-1,iCol=-1,soloUscite=false;
  for(let i=0;i<Math.min(rows.length,12)&&h<0;i++){
    const r=rows[i].map(normS);
    const di=r.findIndex(c=>c.startsWith("DATA"));
    const xi=r.findIndex(c=>/DESCRI|CAUSALE|OPERAZ|DETTAGL/.test(c));
    if(di>=0&&xi>=0){
      h=i;dCol=di;xCol=xi;
      iCol=r.findIndex(c=>/USCITE|ADDEBIT|DARE/.test(c));
      if(iCol>=0)soloUscite=true;else iCol=r.findIndex(c=>/IMPORTO/.test(c));
    }
  }
  if(h<0)return [];
  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];
    const dRaw=r[dCol];
    const data=typeof dRaw==="number"?serialToISO(dRaw):itToISO(dRaw);
    const imp=parseItNum(r[iCol]);
    if(!data||imp==null||imp===0)continue;
    if(!soloUscite&&imp>0)continue;       // colonna IMPORTO unica: le uscite sono i negativi
    out.push({data,descr:String(r[xCol]||"").trim(),importo:Math.abs(imp)});
  }
  return out;
}
async function parseBancaPdf(file){
  if(!window.pdfjsLib)throw new Error("Libreria PDF non caricata");
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const byY={};
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      (byY[y]=byY[y]||[]).push({x:it.transform[4],s:it.str});
    });
    Object.keys(byY).sort((a,b)=>b-a).forEach(y=>{
      lines.push(byY[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(" "));
    });
  }
  if(lines.join("").trim().length===0)throw new Error("PDF senza testo (scansione): scarica il CSV/XLSX dalla banca");
  const out=[];
  lines.forEach(L=>{
    const dm=L.match(/(\d{1,2}[\/\.]\d{1,2}[\/\.]\d{2,4})/);
    const ams=L.match(/-?\d{1,3}(?:\.\d{3})*,\d{2}/g);
    if(!dm||!ams)return;
    const imp=parseItNum(ams[ams.length-1]);
    if(imp==null||imp===0)return;
    let descr=L.replace(dm[0],"");
    ams.forEach(a=>{descr=descr.replace(a,"");});
    descr=descr.replace(/\s+/g," ").trim();
    if(descr.length<4)return;
    out.push({data:itToISO(dm[0]),descr,importo:Math.abs(imp)});
  });
  return out;
}
async function parseBanca(file){
  if(/\.pdf$/i.test(file.name))return parseBancaPdf(file);
  return parseBancaTabella(file);
}

function ChangePassword({onDone}){
  const [p1,setP1]=useState(""),[p2,setP2]=useState(""),[err,setErr]=useState("");
  const go=()=>{
    if(p1.length<8) return setErr("La password deve avere almeno 8 caratteri.");
    if(p1!==p2) return setErr("Le password non coincidono.");
    onDone();
  };
  return <div className="lwrap"><div className="lcard">
    <img src={LOGO_FULL} alt="PraticHub" style={{display:"block",height:72,margin:"0 auto 18px"}}/>
    <div className="sub" style={{textAlign:"center"}}>Primo accesso — imposta una nuova password per continuare</div>
    {err&&<div className="lerr">{err}</div>}
    <div className="lfld"><label>Nuova password</label><input type="password" value={p1} onChange={e=>setP1(e.target.value)}/></div>
    <div className="lfld"><label>Conferma password</label><input type="password" value={p2} onChange={e=>setP2(e.target.value)}/></div>
    <button className="lbtn" onClick={go}>Imposta e accedi</button>

}

function Lista({collab,onOpen}){
  const [q,setQ]=useState(""),[f,setF]=useState("tutti");
  const FILTRI=[["tutti","Tutti"],["730","730"],["del","Incarico sindacale"],["open","In apertura"],["warn","Da verificare"],["risk","📉 A rischio"],["cred","🔑 Con utenza"]];
  const list=useMemo(()=>{
    const t=q.trim().toLowerCase();
    return collab.filter(c=>{
      if(f==="730"&&!c.f730)return false;
      if(f==="del"&&!c.codici.del)return false;
      if(f==="open"&&c.stato!=="open")return false;
      if(f==="warn"&&c.stato!=="warn")return false;
      if(f==="risk"&&trend(c.prod).lvl!=="hi")return false;
      if(f==="cred"&&!c.utente)return false;
      if(!t)return true;
      const hay=[c.nome,c.cf,c.assoc,c.citta,c.note,...Object.values(c.codici),...c.tel,...c.email].join(" ").toLowerCase();
      return hay.includes(t);
    });
  },[q,f,collab]);
  return <React.Fragment>
    <div className="top">
      <div><h1>Collaboratori</h1><div className="sub">{collab.length} collaboratori · ricerca su nome, CF, codici, contatti</div></div>

    <div className="chips">{FILTRI.map(([k,l])=><button key={k} className={"chip"+(f===k?" on":"")} onClick={()=>setF(k)}>{l}</button>)}</div>
    <div className="cnt">{list.length} risultat{list.length===1?"o":"i"}</div>

  </React.Fragment>;
}

function Produzione({collab}){
  const withT=collab.map(c=>({...c,t:trend(c.prod),tot:c.prod.reduce((a,b)=>a+b,0)}));
  const ord={hi:0,md:1,ok:2};
  withT.sort((a,b)=>ord[a.t.lvl]-ord[b.t.lvl]||a.t.pct-b.t.pct);
  const nRisk=withT.filter(c=>c.t.lvl==="hi").length;
  return <React.Fragment>
    <div className="top"><div><h1>Monitoraggio produzione <span className="lockpill">🔒 Solo titolare</span></h1>
      <div className="sub">Andamento pratiche per intercettare cali e rischio abbandono</div></div></div>
    <div className="kpis">
      <div className={"kpi"+(nRisk>0?" alert":"")}><div className="kv">{nRisk}</div><div className="kl">Collaboratori a rischio</div></div>
      <div className="kpi navy"><div className="kv">{withT.reduce((a,c)=>a+c.prod[5],0)}</div><div className="kl">Pratiche ultimo mese</div></div>
      <div className="kpi good"><div className="kv">{withT.filter(c=>c.t.lvl==="ok").length}</div><div className="kl">Stabili o in crescita</div></div>
    </div>
    {withT.map(c=><div key={c.id} className={"prod-card "+c.t.lvl}>
      <div className="who"><div className="n">{c.nome}</div>
        <div className="c">{c.codici.caf?"CAF "+c.codici.caf.replace("*",""):"—"} · {c.tot} pratiche nel periodo</div>
        <div className={"payrow "+(c.pag.reg?"okp":"late")}>{c.pag.reg?"✓ Pagamenti regolari":"● In ritardo"+(c.pag.ins>0?" · insoluto "+eur(c.pag.ins):"")} · ultimo: {c.pag.ult}</div></div>
      <Spark p={c.prod} bad={c.t.lvl==="hi"}/>
      <div className="pstats">
        <div className="pstat"><div className={"v "+(c.t.pct<0?"neg":"pos")}>{c.t.pct>0?"+":""}{c.t.pct}%</div><div className="l">Trend</div></div>
        <div className="pstat"><span className={"riskmini r-"+(c.t.lvl==="hi"?"hi":c.t.lvl==="md"?"md":"ok")}>{c.t.lvl==="hi"?"📉 ":c.t.lvl==="md"?"↘ ":"✓ "}{c.t.lbl}</span></div>
      </div></div>)}
  </React.Fragment>;
}

      {visible.length===0 ? <div className="empty"><div className="big">📭</div>Nessuna pratica con questi filtri.</div> :
      <table className="tbl">
        <thead><tr><th style={{textAlign:"left"}}>Codice</th><th style={{textAlign:"left"}}>Tipo</th><th style={{textAlign:"left"}}>Assistito</th>{!onlyMe&&<th style={{textAlign:"left"}}>Collaboratore</th>}<th style={{textAlign:"left"}}>Stato</th><th style={{textAlign:"left"}}>Aggiornata</th></tr></thead>
        <tbody>
          {visible.map(p=>{
            const tpl=pData.templates.find(t=>t.id===p.templateId);
            const c=collab.find(u=>u.id===p.collaboratorId);
            return <tr className="clk" key={p.id} onClick={()=>go("office_detail",{id:p.id})}>
              <td style={{textAlign:"left"}}><b>{p.code}</b>{unreadChat(p,me.role==="titolare"?"u_office":me.id)>0 && <span className="pill" style={{marginLeft:8,background:"var(--redbg)",color:"var(--red)"}}>💬</span>}</td>
              <td style={{textAlign:"left"}}>{tpl?tpl.name:"—"}</td>
              <td style={{textAlign:"left"}}>{p.assistito||"—"}</td>
              {!onlyMe&&<td style={{textAlign:"left"}}>{c?c.nome:"—"}</td>}
              <td style={{textAlign:"left"}}><StatusBadge st={p.status} sm/></td>
              <td className="muted small" style={{textAlign:"left"}}>{fmtDT(p.updatedAt)}</td>
            </tr>;
          })}
        </tbody>
      </table>}
      </div>
    </div>
  </>;
}

/* ============================== PRATICHE — UFFICIO/TITOLARE — DETTAGLIO ============================== */
function OfficeDetail({pData,setPData,collab,go,toast,id,meId}){
  const p = pData.pratiche.find(x=>x.id===id);
  if(!p) return <div className="empty">Pratica non trovata.</div>;
  const tpl=pData.templates.find(t=>t.id===p.templateId);
  const c=collab.find(u=>u.id===p.collaboratorId);
  const [tab,setTab]=useState("documenti");
  const [reqOpen,setReqOpen]=useState(false);
  const [reqNote,setReqNote]=useState("");
  const ricevutaInput=useRef();

  function update(mut){
    setPData(d=>({...d,pratiche:d.pratiche.map(x=>{ if(x.id!==id)return x; const cc={...x}; mut(cc); cc.updatedAt=Date.now(); return cc; })}));
  }
  function addAudit(cc,action){ cc.audit=[...(cc.audit||[]),{ts:Date.now(),actor:"Ufficio",action}]; }
  function postMessage(text){
    update(cc=>{ cc.messages=[...(cc.messages||[]),{id:nid("m_"),authorId:meId,authorName:"Ufficio",role:"titolare",text,ts:Date.now()}]; cc.chatReadBy={...(cc.chatReadBy||{}),[meId]:Date.now()}; });
  }
  useEffect(()=>{ setPData(d=>({...d,pratiche:d.pratiche.map(x=>{
    if(x.id!==id) return x;
    const now=Date.now();
    const messages=(x.messages||[]).map(m=> (m.authorId!==meId && !(m.readBy&&m.readBy[meId])) ? {...m,readBy:{...(m.readBy||{}),[meId]:now}} : m);
    return {...x,messages};
  })})); },[id]);

  function setStatus(st,note){
    update(cc=>{ cc.status=st; cc.statusHistory=[...(cc.statusHistory||[]),{status:st,ts:Date.now(),note:note||""}]; addAudit(cc,"Stato → "+STATUSES[st].label);});
    toast("Stato aggiornato: "+STATUSES[st].label+" · email inviata a "+(c?c.nome:"collaboratore"));
  }

  async function uploadRicevute(files){
    const arr=[];
    for(const f of files){ arr.push({id:nid("r_"),name:f.name,size:f.size,blob:f,uploadedAt:Date.now(),hash:(await sha256(f)).slice(0,16)}); }
    update(cc=>{ cc.ricevute=[...(cc.ricevute||[]),...arr]; addAudit(cc,arr.length+" ricevuta/e caricata/e");
      if(cc.status!=="ricevute_disponibili"){ cc.status="ricevute_disponibili"; cc.statusHistory=[...(cc.statusHistory||[]),{status:"ricevute_disponibili",ts:Date.now(),note:"Ricevute caricate"}]; }});
    toast("Ricevute caricate · stato impostato su \"Ricevute disponibili\"");
  }

  async function zipAll(){
    const zip=new JSZip();
    (p.files||[]).forEach(f=> zip.file(f.name, f.blob));
    const blob=await zip.generateAsync({type:"blob"});
    downloadBlob(blob, p.code+"_documenti.zip");
    toast("Archivio ZIP generato");
  }

  const docFiles=p.files||[];

  return <>
    <button className="btn btn-g btn-sm" onClick={()=>go("office_pratiche")} style={{marginBottom:14}}>← Pratiche</button>
    <div className="panel pad" style={{marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <div className="muted small">{tpl?tpl.ente:""} · {tpl?tpl.name:""}</div>
          <h2 style={{margin:"4px 0 6px"}}>{p.code} — {p.assistito||"Assistito"}</h2>
          <div className="muted small">Collaboratore: <b style={{color:"var(--ink)"}}>{c?c.nome:"—"}</b> · Creata {fmtDT(p.createdAt)} · Inviata {fmtDT(p.submittedAt)}</div>
        </div>
        <StatusBadge st={p.status}/>
      </div>
    </div>

    <div className="grid2">
      <div>
        <div className="panel">
          <div className="tabs" style={{padding:"0 18px"}}>
            <button className={tab==="documenti"?"on":""} onClick={()=>setTab("documenti")}>Documenti ({docFiles.length})</button>
            <button className={tab==="dati"?"on":""} onClick={()=>setTab("dati")}>Dati modulo</button>
            <button className={tab==="ricevute"?"on":""} onClick={()=>setTab("ricevute")}>Ricevute ({(p.ricevute||[]).length})</button>
            <button className={tab==="log"?"on":""} onClick={()=>setTab("log")}>Registro</button>
          </div>
          <div className="pad">
            {tab==="documenti" && <>
              {docFiles.length===0? <div className="empty"><div className="big">📄</div>Nessun documento caricato.</div> : <>
                <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
                  <button className="btn btn-g btn-sm" onClick={zipAll}>🗜️ Scarica tutto (ZIP)</button>
                </div>
                {docFiles.map(f=>(
                  <div className="filecard" key={f.id}>
                    <div className="doc-ic uploaded">📎</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis"}}>{f.name}
                        {f.addedAfterSubmit && <span className="pill use" style={{marginLeft:8}}>integrazione</span>}</div>
                      <div className="muted small">{f.slotLabel||"Documento"} · {human(f.size)} · {fmtDT(f.uploadedAt)}</div>
                      <div style={{marginTop:3}}><span className="hashtag" title="Impronta SHA-256 al momento dell'invio">🔒 {f.hash}</span></div>
                    </div>
                    <button className="btn btn-g btn-sm" onClick={()=>downloadBlob(f.blob,f.name)}>Scarica</button>
                  </div>
                ))}
              </>}
            </>}
            {tab==="dati" && <DatiModulo p={p} tpl={tpl}/>}
            {tab==="ricevute" && <>
              <input ref={ricevutaInput} type="file" multiple style={{display:"none"}} onChange={e=>{uploadRicevute([...e.target.files]); e.target.value="";}}/>
              <button className="btn btn-t btn-sm" onClick={()=>ricevutaInput.current.click()} style={{marginBottom:12}}>📥 Carica ricevuta</button>
              {(p.ricevute||[]).length===0? <p className="muted">Nessuna ricevuta caricata. Quando ne carichi una, lo stato passa automaticamente a "Ricevute disponibili" e il collaboratore riceve l'email.</p> :
                (p.ricevute||[]).map(r=>(
                  <div className="filecard" key={r.id}>
                    <div className="doc-ic" style={{background:"#e7f6ec",color:"#0a6b2e"}}>🧾</div>
                    <div style={{flex:1}}><div style={{fontWeight:600}}>{r.name}</div><div className="muted small">{human(r.size)} · {fmtDT(r.uploadedAt)}</div></div>
                    <button className="btn btn-g btn-sm" onClick={()=>downloadBlob(r.blob,r.name)}>Scarica</button>
                  </div>
                ))}
            </>}
            {tab==="log" && <AuditLog p={p}/>}
          </div>
        </div>
      </div>

      <div>
        <div className="panel pad" style={{marginBottom:14}}>
          <h4 style={{margin:"0 0 12px"}}>Gestione stato</h4>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <button className="btn btn-sky btn-sm" disabled={p.status==="in_lavorazione"} onClick={()=>setStatus("in_lavorazione")}>▶︎ Prendi in carico</button>
            <button className="btn btn-r btn-sm" onClick={()=>{setReqNote("");setReqOpen(true);}}>📋 Richiedi documenti</button>
            <button className="btn btn-t btn-sm" disabled={p.status==="trasmessa"||p.status==="ricevute_disponibili"} onClick={()=>setStatus("trasmessa")}>✓ Segna trasmessa</button>
          </div>
          <div className="lock-box" style={{marginTop:14}}>
            <span>🔒</span><div>I documenti inviati sono <b>bloccati</b>. In "Richiesta documenti" il collaboratore può <b>solo aggiungere</b> nuovi file, mai sostituire quelli esistenti.</div>
          </div>
        </div>
        <div className="panel pad">
          <h4 style={{margin:"0 0 12px"}}>Avanzamento</h4>
          <Timeline p={p}/>
        </div>
        {c && (c.tel?.[0]||c.email?.[0]||c.cf) && <div className="panel pad" style={{marginTop:14}}>
          <h4 style={{margin:"0 0 10px"}}>Contatti collaboratore</h4>
          <div className="muted small" style={{lineHeight:1.9}}>
            <div><b style={{color:"var(--ink)"}}>{c.nome}</b></div>
            {c.tel?.[0] && <div>📞 {c.tel[0]}</div>}
            {c.email?.[0] && <div>✉️ {c.email[0]}</div>}
            {c.citta && <div>📍 {c.citta}</div>}
            {c.cf && <div>🆔 {c.cf}</div>}
          </div>
        </div>}
        <div className="panel pad" style={{marginTop:14}}>
          <h4 style={{margin:"0 0 8px"}}>💬 Chat pratica</h4>
          <PraticaChat p={p} meId={meId} meName="Ufficio" meRole="titolare" onSend={postMessage}/>
        </div>
      </div>
    </div>

    {reqOpen && <ModalP title="Richiedi documenti al collaboratore" onClose={()=>setReqOpen(false)}>
      <p style={{marginTop:0}} className="muted">Scrivi quali documenti mancano o cosa va corretto. Il collaboratore vedrà questa nota e potrà <b>aggiungere</b> i file richiesti, senza toccare quelli già inviati.</p>
      <textarea className="formrow" style={{width:"100%",border:"1.5px solid var(--line)",borderRadius:9,padding:"9px 11px"}} rows={4} value={reqNote} onChange={e=>setReqNote(e.target.value)} placeholder="Es. Manca la seconda busta paga; il documento d'identità è illeggibile."/>
      <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:16}}>
        <button className="btn btn-g" onClick={()=>setReqOpen(false)}>Annulla</button>
        <button className="btn btn-r" onClick={()=>{setStatus("richiesta_documenti",reqNote);setReqOpen(false);}}>📋 Invia richiesta</button>
      </div>
    </ModalP>}
  </>;
}

/* ============================== EDITOR TIPO DI PRATICA ============================== */
function TemplateEditor({pData,setPData,go,toast,id}){
  const original=pData.templates.find(t=>t.id===id);
  const [t,setT]=useState(()=>JSON.parse(JSON.stringify(original)));
  const [aiOpen,setAiOpen]=useState(false);
  const [tab,setTab]=useState("docs");
  const [modelIdx,setModelIdx]=useState(null);

  function save(){
    setPData(d=>({...d,templates:d.templates.map(x=>x.id===id?t:x)}));
    toast("Tipo di pratica salvato"); go("office_templates");
  }
  function applyAI(key){
    const lib=LIBRARY[key];
    const extra=(lib.extra||[]).map(e=>({id:nid("f_"),label:e.label,type:e.type,required:e.required}));
    setT(s=>({...s,name:key,ente:lib.ente,
      fields:[...BASE_FIELDS.map(f=>({...f})),...extra],
      docs:[
        {id:nid("d_"),label:"Modulo di delega (da far firmare)",cat:"obbligatorio",model:{kind:"text",body:DEFAULT_DOC_BODY}},
        ...[...BASE_DOCS,...lib.docs].map(d=>({id:nid("d_"),label:d.label,cat:d.cat,model:null}))
      ],
      docTitle:"Delega — "+key }));
    setAiOpen(false); toast("Bozza generata — ora puoi modificarla");
  }
  const setDoc=(i,patch)=> setT(s=>({...s,docs:s.docs.map((d,j)=>j===i?{...d,...patch}:d)}));
  const addDoc=()=> setT(s=>({...s,docs:[...s.docs,{id:nid("d_"),label:"Nuovo documento",cat:"obbligatorio"}]}));
  const delDoc=(i)=> setT(s=>({...s,docs:s.docs.filter((_,j)=>j!==i)}));
  const setF=(i,patch)=> setT(s=>({...s,fields:s.fields.map((f,j)=>j===i?{...f,...patch}:f)}));
  const addF=()=> setT(s=>({...s,fields:[...s.fields,{id:nid("f_"),label:"Nuovo campo",type:"text",required:false}]}));
  const delF=(i)=> setT(s=>({...s,fields:s.fields.filter((_,j)=>j!==i)}));

  return <>
    <button className="btn btn-g btn-sm" onClick={()=>go("office_templates")} style={{marginBottom:14}}>← Tipi di pratica</button>
    <div className="panel pad" style={{marginBottom:16}}>
      <div className="row">
        <div style={{flex:2}}>
          <label className="fld" style={{display:"block",fontSize:12,fontWeight:700,color:"var(--mut)",marginBottom:6}}>Nome del tipo di pratica</label>
          <input className="search" style={{padding:"10px 13px"}} value={t.name} onChange={e=>setT(s=>({...s,name:e.target.value}))}/>
        </div>
        <div style={{maxWidth:160}}>
          <label className="fld" style={{display:"block",fontSize:12,fontWeight:700,color:"var(--mut)",marginBottom:6}}>Ente</label>
          <select className="search" style={{padding:"10px 13px"}} value={t.ente} onChange={e=>setT(s=>({...s,ente:e.target.value}))}>
            <option>INPS</option><option>INAIL</option><option>Altro</option>
          </select>
        </div>
      </div>
      <div style={{marginTop:14}}>
        <button className="btn btn-sky btn-sm" onClick={()=>setAiOpen(true)}>✨ Genera bozza documenti con l'assistente</button>
      </div>
      <div className="infobox" style={{marginTop:12,marginBottom:0}}>
        L'assistente propone una checklist di partenza per il tipo di pratica. <b>Tu la correggi e la salvi.</b> In produzione la bozza è generata dal backend (anche con ricerca web come supporto); qui è precaricata sui tipi più comuni.
      </div>
    </div>

    <div className="tabs" style={{marginBottom:0,background:"#fff",borderRadius:"14px 14px 0 0",border:"1px solid var(--line)",borderBottom:"none",padding:"0 14px"}}>
      <button className={tab==="docs"?"on":""} onClick={()=>setTab("docs")}>Documenti richiesti</button>
      <button className={tab==="fields"?"on":""} onClick={()=>setTab("fields")}>Campi modulo (versione A)</button>
      <button className={tab==="doc"?"on":""} onClick={()=>setTab("doc")}>Modulo precompilato (versione B)</button>
    </div>

    {tab==="docs" && <div className="panel pad" style={{borderRadius:"0 0 14px 14px",marginTop:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span className="muted small">Categoria: <span className="pill req">obbligatorio</span> <span className="pill use">utile</span> <span className="pill opt">opzionale</span></span>
        <button className="btn btn-g btn-sm" onClick={addDoc}>+ Documento</button>
      </div>
      {t.docs.map((d,i)=>(
        <div key={d.id} style={{border:"1px solid var(--line)",borderRadius:11,padding:12,marginBottom:8}}>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input className="search" style={{padding:"9px 12px",flex:1}} value={d.label} onChange={e=>setDoc(i,{label:e.target.value})}/>
            <button className="btn btn-g btn-sm" onClick={()=>delDoc(i)} title="Elimina">×</button>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center",marginTop:10,flexWrap:"wrap"}}>
            <div className="chips" style={{margin:0}}>
              {[["obbligatorio","req"],["utile","use"],["opzionale","opt"]].map(([cc,k])=>(
                <button key={cc} className={"chip"+(d.cat===cc?" on":"")} onClick={()=>setDoc(i,{cat:cc})}>{cc}</button>
              ))}
            </div>
            <div style={{flex:1,minWidth:8}}/>
            {d.model ? <span className="muted small" style={{display:"flex",alignItems:"center",gap:8}}>
                {d.model.kind==="file"?"📎 "+d.model.fileName:"📝 Modello precompilabile"}
                <button className="btn btn-g btn-sm" onClick={()=>setModelIdx(i)}>Modifica</button>
                <button className="btn btn-g btn-sm" style={{color:"var(--red)"}} onClick={()=>setDoc(i,{model:null})} title="Rimuovi modello">×</button>
              </span>
              : <button className="btn btn-g btn-sm" onClick={()=>setModelIdx(i)}>+ Modello standard</button>}
          </div>
        </div>
      ))}
    </div>}

    {tab==="fields" && <div className="panel pad" style={{borderRadius:"0 0 14px 14px",marginTop:0}}>
      <p className="muted small" style={{marginTop:0}}>Questi campi compaiono al collaboratore come <b>modulo dinamico</b> quando sceglie questo tipo di pratica.</p>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8}}><button className="btn btn-g btn-sm" onClick={addF}>+ Campo</button></div>
      {t.fields.map((f,i)=>(
        <div className="filecard" key={f.id}>
          <input className="search" style={{padding:"9px 12px",flex:2}} value={f.label} onChange={e=>setF(i,{label:e.target.value})}/>
          <select className="search" style={{padding:"9px 12px",maxWidth:130}} value={f.type} onChange={e=>setF(i,{type:e.target.value})}>
            <option value="text">Testo</option><option value="number">Numero</option><option value="date">Data</option>
          </select>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13}}><input type="checkbox" checked={f.required} onChange={e=>setF(i,{required:e.target.checked})}/> Obbligatorio</label>
          <button className="btn btn-g btn-sm" onClick={()=>delF(i)}>×</button>
        </div>
      ))}
    </div>}

    {tab==="doc" && <div className="panel pad" style={{borderRadius:"0 0 14px 14px",marginTop:0}}>
      <div className="infobox" style={{marginBottom:14}}>
        Usa i segnaposto tra doppie graffe: <span className="hashtag">{"{{cognome}}"}</span> <span className="hashtag">{"{{nome}}"}</span> <span className="hashtag">{"{{codice_fiscale}}"}</span> <span className="hashtag">{"{{luogo_nascita}}"}</span> <span className="hashtag">{"{{data_nascita}}"}</span> <span className="hashtag">{"{{indirizzo}}"}</span> <span className="hashtag">{"{{data_firma}}"}</span>. Verranno compilati con i dati del modulo.
      </div>
      <label className="fld" style={{display:"block",fontSize:12,fontWeight:700,color:"var(--mut)",marginBottom:6}}>Titolo del documento</label>
      <input className="search" style={{padding:"10px 13px",marginBottom:12}} value={t.docTitle} onChange={e=>setT(s=>({...s,docTitle:e.target.value}))}/>
      <label className="fld" style={{display:"block",fontSize:12,fontWeight:700,color:"var(--mut)",marginBottom:6}}>Testo del documento</label>
      <textarea className="search" rows={12} value={t.docBody} onChange={e=>setT(s=>({...s,docBody:e.target.value}))} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,padding:"10px 13px"}}/>
    </div>}

    <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:18}}>
      <button className="btn btn-g" onClick={()=>go("office_templates")}>Annulla</button>
      <button className="btn btn-p" onClick={save}>💾 Salva tipo di pratica</button>
    </div>

    {aiOpen && <ModalP title="✨ Genera bozza con l'assistente" onClose={()=>setAiOpen(false)}>
      <p style={{marginTop:0}} className="muted">Scegli un tipo di pratica: l'assistente precompila documenti e campi. Poi modifichi tutto liberamente.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {LIBRARY_KEYS.map(k=>(
          <button key={k} className="tplist-row" style={{margin:0}} onClick={()=>applyAI(k)}>
            <div className="ti" style={{fontSize:11,background:LIBRARY[k].ente==="INAIL"?"var(--teal)":"var(--sky)"}}>{LIBRARY[k].ente}</div>
            <div style={{flex:1,fontSize:13,fontWeight:600,textAlign:"left"}}>{k}</div>
          </button>
        ))}
      </div>
    </ModalP>}

    {modelIdx!==null && <ModelEditor doc={t.docs[modelIdx]} onClose={()=>setModelIdx(null)}
      onSave={(model)=>{setDoc(modelIdx,{model});setModelIdx(null);toast("Modello associato al documento");}}/>}
  </>;
}

/* editor del modello standard di un singolo documento (lato ufficio) */
function ModelEditor({doc,onClose,onSave}){
  const [kind,setKind]=useState(doc.model?doc.model.kind:"file");
  const [body,setBody]=useState(doc.model&&doc.model.kind==="text"?doc.model.body:DEFAULT_DOC_BODY);
  const [file,setFile]=useState(doc.model&&doc.model.kind==="file"?{fileName:doc.model.fileName,blob:doc.model.blob}:null);
  function save(){
    if(kind==="file"){ if(!file){onClose();return;} onSave({kind:"file",fileName:file.fileName,blob:file.blob}); }
    else onSave({kind:"text",body});
  }
  return <ModalP title={"Modello standard — "+doc.label} onClose={onClose}>
    <div className="chips" style={{marginBottom:14}}>
      <button className={"chip"+(kind==="file"?" on":"")} onClick={()=>setKind("file")}>Carica file</button>
      <button className={"chip"+(kind==="text"?" on":"")} onClick={()=>setKind("text")}>Modello testo (precompilabile)</button>
    </div>
    {kind==="file" ? <>
      <p className="muted small" style={{marginTop:0}}>Carica il modulo standard (Word, PDF...). Il collaboratore lo scarica così com'è, lo compila e lo fa firmare al cliente.</p>
      <label className="btn btn-g" style={{cursor:"pointer",display:"inline-flex"}}>📎 Scegli file<input type="file" style={{display:"none"}} onChange={e=>{const f=e.target.files[0]; if(f)setFile({fileName:f.name,blob:f}); e.target.value="";}}/></label>
      {file && <div className="filecard" style={{marginTop:10}}><div className="doc-ic">📎</div><div style={{flex:1}}>{file.fileName}</div></div>}
    </> : <>
      <div className="infobox" style={{marginBottom:12}}>Segnaposto compilati con i dati anagrafici del collaboratore: <span className="hashtag">{"{{cognome}}"}</span> <span className="hashtag">{"{{nome}}"}</span> <span className="hashtag">{"{{codice_fiscale}}"}</span> <span className="hashtag">{"{{luogo_nascita}}"}</span> <span className="hashtag">{"{{data_nascita}}"}</span> <span className="hashtag">{"{{indirizzo}}"}</span> <span className="hashtag">{"{{data_firma}}"}</span></div>
      <textarea className="search" rows={10} value={body} onChange={e=>setBody(e.target.value)} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,padding:"10px 13px",width:"100%"}}/>
    </>}
    <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:16}}>
      <button className="btn btn-g" onClick={onClose}>Annulla</button>
      <button className="btn btn-p" onClick={save}>Salva modello</button>
    </div>
  </ModalP>;
}

/* checklist documenti riutilizzabile (nuova pratica + bozza) */
function DocChecklist({tpl,getFiles,onAdd,onRemove,canEdit,fieldValues,toast}){
  function dlModel(d){
    if(!d.model) return;
    if(d.model.kind==="file"){ downloadBlob(d.model.blob,d.model.fileName); }
    else { downloadDoc(d.label, fillBody(d.model.body,fieldValues)); }
    if(toast) toast("Modello scaricato"+(d.model.kind==="text"?" e precompilato":""));
  }
  return <>{["obbligatorio","utile","opzionale"].map(cat=>{
    const list=tpl.docs.filter(d=>d.cat===cat); if(!list.length) return null;
    const pillc=cat==="obbligatorio"?"req":cat==="utile"?"use":"opt";
    return <div key={cat} style={{marginBottom:8}}>
      <div style={{margin:"10px 0 4px"}}><span className={"pill "+pillc}>{cat}</span></div>
      {list.map(d=>{
        const fs=getFiles(d.id)||[];
        return <div className="filecard" key={d.id}>
          <div className={"doc-ic "+(fs.length?"uploaded":"")} style={!fs.length&&cat==="obbligatorio"?{background:"var(--redbg)"}:{}}>{fs.length?"✓":"+"}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600}}>{d.label}</div>
            {d.model && <div className="muted small" style={{marginTop:2}}>{d.model.kind==="file"?"📎 Modello: "+d.model.fileName:"📝 Modello precompilabile disponibile"}</div>}
            {fs.map((fl,i)=>(
              <div className="muted small" key={i} style={{display:"flex",gap:8,alignItems:"center"}}>📎 {fl.name} ({human(fl.size)}) {canEdit && <button className="btn btn-g btn-sm" style={{padding:"2px 7px"}} onClick={()=>onRemove(d.id,i,fl)}>×</button>}</div>
            ))}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
            {d.model && <button className="btn btn-g btn-sm" onClick={()=>dlModel(d)}>📥 Modello</button>}
            {canEdit && <label className="btn btn-g btn-sm" style={{cursor:"pointer"}}>Allega<input type="file" multiple style={{display:"none"}} onChange={e=>{onAdd(d.id,[...e.target.files]);e.target.value="";}}/></label>}
          </div>
        </div>;
      })}
    </div>;
  })}</>;
}

/* ============================== CHAT DI PRATICA ============================== */
function PraticaChat({p,meId,meName,meRole,onSend}){
  const [text,setText]=useState("");
  const msgs=p.messages||[];
  const endRef=useRef();
  useEffect(()=>{ if(endRef.current) endRef.current.scrollIntoView({block:"nearest"}); },[msgs.length]);
  function send(){ const t=text.trim(); if(!t)return; onSend(t); setText(""); }
  return <div>
    <div className="chatbox">
      {msgs.length===0 && <p className="muted small" style={{margin:"6px 0"}}>Nessun messaggio. Usa la chat per comunicazioni intermedie su questa pratica (senza dover telefonare).</p>}
      {msgs.map(m=>{
        const mine=m.authorId===meId;
        let readTs=null;
        if(m.readBy){ for(const uid in m.readBy){ if(uid!==m.authorId){ readTs=m.readBy[uid]; break; } } }
        return <div key={m.id} className={"chatmsg "+(mine?"me":"them")}>
          <div style={{whiteSpace:"pre-wrap"}}>{m.text}</div>
          <div className="cm-meta">
            {m.authorName}{m.role==="titolare"?" (ufficio)":""} · {fmtDT(m.ts)}
            {mine && (readTs? " · visualizzato":" · consegnato")}
          </div>
        </div>;
      })}
      <div ref={endRef}/>
    </div>
    <div className="chatform">
      <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")send();}} placeholder="Scrivi un messaggio..."/>
      <button className="btn btn-p btn-sm" onClick={send}>Invia</button>
    </div>
  </div>;
}

            <td style={{textAlign:"left"}}>{tpl?tpl.name:"—"}</td><td style={{textAlign:"left"}}>{p.assistito||"—"}</td>
            <td style={{textAlign:"left"}}><StatusBadge st={p.status} sm/></td><td className="muted small" style={{textAlign:"left"}}>{fmtDT(p.updatedAt)}</td>
          </tr>;
        })}</tbody>
      </table>}
      </div>
    </div>}
